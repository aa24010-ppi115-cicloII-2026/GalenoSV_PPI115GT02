<?xml version="1.0" encoding="UTF-8"?>
<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:cc="jakarta.faces.composite"
              xmlns:ui="jakarta.faces.facelets"
              xmlns:h="jakarta.faces.html"
              xmlns:p="http://primefaces.org/ui">

    <cc:interface>
        <cc:attribute name="modelo"
                      type="sv.edu.ues_occ_ingenieria_pp115_2026_salud.galenosv.boundary.AbstractModel"
                      required="true"/>
        <cc:attribute name="actualizar"
                      type="java.lang.String"
                      default=":pnlTabla :pnlDetalle"
                      required="false"/>
    </cc:interface>

    <cc:implementation>
        <h:panelGrid columns="#{cc.attrs.modelo.estado eq 'NADA' ? 1 : 2}">
            <p:commandButton id="btnNuevo"
                             value="#{msg['boton.nuevo']} #{cc.attrs.modelo.nombreBean}"
                             actionListener="#{cc.attrs.modelo.btnNuevoHandler}"
                             rendered="#{cc.attrs.modelo.estado eq 'NADA'}"
                             update="#{cc.attrs.actualizar}"/>
            <p:commandButton id="btnCancelar"
                             value="#{msg['boton.cancelar']}"
                             actionListener="#{cc.attrs.modelo.btnCancelarHandler}"
                             rendered="#{cc.attrs.modelo.estado ne 'NADA'}"
                             update="#{cc.attrs.actualizar}"/>
        </h:panelGrid>
    </cc:implementation>
</ui:component>
