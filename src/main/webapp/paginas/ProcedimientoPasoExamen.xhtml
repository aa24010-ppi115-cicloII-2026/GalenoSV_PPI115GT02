<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['procedimientoPasoExamen.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['procedimientoPasoExamen.titulo']}</ui:define>
    <ui:define name="contenido">
        <h:panelGrid id="pnlContenido" columns="1" style="width:100%">
            <h:panelGroup id="pnlTabla" layout="block" rendered="#{procedimientoPasoExamenModel.estado eq 'NADA'}">
                <h:form id="frmTabla">
                    <g:botonesTop modelo="#{procedimientoPasoExamenModel}" actualizar=":pnlContenido :mensajes"/>
                    <p:dataTable id="tabla" value="#{procedimientoPasoExamenModel.modelo}" var="r" lazy="true"
                                 paginator="true" rows="#{procedimientoPasoExamenModel.cantidadRegistros}" paginatorPosition="bottom"
                                 emptyMessage="#{msg['tabla.sinRegistros']}" selectionMode="single"
                                 selection="#{procedimientoPasoExamenModel.registro}" rowKey="#{r.idProcedimientoPasoExamen}">
                        <p:ajax event="rowSelect" listener="#{procedimientoPasoExamenModel.selectionHandler}"
                                     resetValues="true" update=":pnlContenido :mensajes :avisos"/>
                        <p:column headerText="#{msg['procedimientoPasoExamen.tabla.paso']}"><h:outputText value="#{r.idProcedimientoPaso.nombre}"/></p:column>
                        <p:column headerText="#{msg['procedimientoPasoExamen.tabla.examen']}"><h:outputText value="#{r.idExamen.nombre}"/></p:column>
                        <p:column headerText="#{msg['tabla.activo']}"><h:outputText value="#{r.activo ? msg['tabla.activo'] : msg['tabla.inactivo']}"/></p:column>
                        <p:column headerText="#{msg['tabla.observaciones']}"><h:outputText value="#{r.observaciones}"/></p:column>
                    </p:dataTable>
                </h:form>
            </h:panelGroup>
            <h:panelGroup id="pnlDetalle" layout="block">
                <h:form id="frmDetalle" rendered="#{procedimientoPasoExamenModel.estado ne 'NADA'}">
                    <g:botonesTop modelo="#{procedimientoPasoExamenModel}" actualizar=":pnlContenido :mensajes"/>
                    <h:panelGrid columns="2" cellpadding="5">
                        <p:outputLabel for="txtId" value="#{msg['procedimientoPasoExamen.form.id']}"/>
                        <p:inputText id="txtId" value="#{procedimientoPasoExamenModel.registro.idProcedimientoPasoExamen}" size="50" disabled="true"/>
                        <p:outputLabel for="cmbPaso" value="#{msg['procedimientoPasoExamen.form.paso']}"/>
                        <p:selectOneMenu id="cmbPaso" value="#{procedimientoPasoExamenModel.idProcedimientoPasoSeleccionado}" required="true" requiredMessage="#{msg['validacion.seleccione']}">
                            <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                            <f:selectItems value="#{procedimientoPasoExamenModel.pasos}" var="p" itemLabel="#{p.nombre}" itemValue="#{p.idProcedimientoPaso}"/>
                        </p:selectOneMenu>
                        <p:outputLabel for="cmbExamen" value="#{msg['procedimientoPasoExamen.form.examen']}"/>
                        <p:selectOneMenu id="cmbExamen" value="#{procedimientoPasoExamenModel.idExamenSeleccionado}" required="true" requiredMessage="#{msg['validacion.seleccione']}">
                            <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                            <f:selectItems value="#{procedimientoPasoExamenModel.examenes}" var="e" itemLabel="#{e.nombre}" itemValue="#{e.idExamen}"/>
                        </p:selectOneMenu>
                        <p:outputLabel for="chkActivo" value="#{msg['procedimientoPasoExamen.form.activo']}"/>
                        <p:toggleSwitch id="chkActivo" value="#{procedimientoPasoExamenModel.registro.activo}"/>
                        <p:outputLabel for="txtObservaciones" value="#{msg['procedimientoPasoExamen.form.observaciones']}"/>
                        <p:inputTextarea id="txtObservaciones" value="#{procedimientoPasoExamenModel.registro.observaciones}" rows="4" cols="50" maxlength="1000"/>
                    </h:panelGrid>
                    <h:panelGrid columns="#{procedimientoPasoExamenModel.estado eq 'CREAR' ? 1 : 2}">
                        <p:commandButton id="btnGuardar" icon="pi pi-check" value="#{msg['boton.guardar']}" actionListener="#{procedimientoPasoExamenModel.btnGuardarHandler}" rendered="#{procedimientoPasoExamenModel.estado eq 'CREAR'}" update=":pnlContenido :mensajes :avisos" styleClass="ui-button-success"/>
                        <p:commandButton id="btnModificar" icon="pi pi-pencil" value="#{msg['boton.modificar']}" actionListener="#{procedimientoPasoExamenModel.btnModificarHandler}" rendered="#{procedimientoPasoExamenModel.estado eq 'MODIFICAR'}" update=":pnlContenido :mensajes :avisos" styleClass="ui-button-warning"/>
                        <p:commandButton id="btnEliminar" icon="pi pi-trash" value="#{msg['boton.eliminar']}" actionListener="#{procedimientoPasoExamenModel.btnEliminarHandler}" rendered="#{procedimientoPasoExamenModel.estado eq 'MODIFICAR'}" update=":pnlContenido :mensajes :avisos" styleClass="ui-button-danger"/>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>
        </h:panelGrid>
    </ui:define>
</ui:composition>
