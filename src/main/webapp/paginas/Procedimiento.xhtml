<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core" xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui" xmlns:ui="jakarta.faces.facelets"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">Procedimientos - GalenoSV</ui:define>
    <ui:define name="encabezado">Procedimientos</ui:define>
    <ui:define name="contenido">
        <h:form id="frmProcedimiento">
            <p:messages id="mensajes" showDetail="true" closable="true"/>

            <h:panelGroup id="contenidoProcedimiento" layout="block">
                <h:panelGroup rendered="#{procedimientoModel.estado eq 'NADA'}">
                    <div class="video-actions">
                        <p:commandButton value="Nuevo Procedimiento" icon="pi pi-plus"
                                         actionListener="#{procedimientoModel.btnNuevoHandler}"
                                         resetValues="true" update="contenidoProcedimiento mensajes"/>
                    </div>
                    <p:dataTable id="tabla" value="#{procedimientoModel.modelo}" var="r" lazy="true"
                                 paginator="true" rows="#{procedimientoModel.cantidadRegistros}"
                                 paginatorPosition="bottom" emptyMessage="No se encontraron procedimientos"
                                 selectionMode="single" selection="#{procedimientoModel.registro}"
                                 rowKey="#{r.idProcedimiento}">
                        <p:ajax event="rowSelect" listener="#{procedimientoModel.selectionHandler}"
                                resetValues="true" update="contenidoProcedimiento mensajes"/>
                        <p:column headerText="Nombre"><h:outputText value="#{r.nombre}"/></p:column>
                        <p:column headerText="Activo"><h:outputText value="#{r.activo ? 'Sí' : 'No'}"/></p:column>
                    </p:dataTable>
                </h:panelGroup>

                <h:panelGroup rendered="#{procedimientoModel.estado ne 'NADA'}">
                    <div class="video-actions">
                        <p:commandButton value="Cancelar Procedimiento" icon="pi pi-times"
                                         actionListener="#{procedimientoModel.btnCancelarHandler}" immediate="true"
                                         styleClass="ui-button-secondary" resetValues="true" update="contenidoProcedimiento mensajes"/>
                    </div>

                    <p:tabView id="tabsProcedimiento">
                        <p:tab title="Detalle">
                            <h:panelGrid columns="2" cellpadding="4" styleClass="video-form-grid">
                                <p:outputLabel for="idProcedimiento" value="ID"/>
                                <p:inputText id="idProcedimiento" value="#{procedimientoModel.registro.idProcedimiento}"
                                             size="52" disabled="true"/>
                                <p:outputLabel for="nombreProcedimiento" value="Nombre *"/>
                                <p:inputText id="nombreProcedimiento" value="#{procedimientoModel.registro.nombre}"
                                             size="52" required="true" maxlength="255"/>
                                <p:outputLabel for="activoProcedimiento" value="Activo"/>
                                <p:selectBooleanCheckbox id="activoProcedimiento" value="#{procedimientoModel.registro.activo}"/>
                                <p:outputLabel for="observacionesProcedimiento" value="Observaciones"/>
                                <p:inputTextarea id="observacionesProcedimiento"
                                                 value="#{procedimientoModel.registro.observaciones}"
                                                 rows="3" cols="50" maxlength="1000"/>
                            </h:panelGrid>
                            <div class="video-actions">
                                <p:commandButton value="Guardar Procedimiento" icon="pi pi-save"
                                                 actionListener="#{procedimientoModel.btnGuardarHandler}"
                                                 rendered="#{procedimientoModel.estado eq 'CREAR'}"
                                                 process="@this idProcedimiento nombreProcedimiento activoProcedimiento observacionesProcedimiento"
                                                 update=":frmProcedimiento:contenidoProcedimiento :frmProcedimiento:mensajes :avisos"/>
                                <p:commandButton value="Guardar Procedimiento" icon="pi pi-save"
                                                 actionListener="#{procedimientoModel.btnModificarHandler}"
                                                 rendered="#{procedimientoModel.estado eq 'MODIFICAR'}"
                                                 process="@this idProcedimiento nombreProcedimiento activoProcedimiento observacionesProcedimiento"
                                                 update=":frmProcedimiento:contenidoProcedimiento :frmProcedimiento:mensajes :avisos"/>
                                <p:commandButton value="Eliminar" icon="pi pi-trash"
                                                 actionListener="#{procedimientoModel.btnEliminarHandler}"
                                                 rendered="#{procedimientoModel.estado eq 'MODIFICAR'}"
                                                 process="@this" update="contenidoProcedimiento mensajes"
                                                 styleClass="ui-button-danger"/>
                            </div>
                        </p:tab>

                        <p:tab title="Pasos" disabled="#{procedimientoModel.estado eq 'CREAR'}">
                            <h:panelGroup id="panelPasos" layout="block">
                                <h:panelGroup rendered="#{not procedimientoModel.capturandoPaso}">
                                    <div class="video-actions">
                                        <p:commandButton value="Nuevo Paso Inicial" icon="pi pi-plus"
                                                         actionListener="#{procedimientoModel.prepararCapturaPaso}"
                                                         process="@this" resetValues="true" update="panelPasos"
                                                         rendered="#{procedimientoModel.puedeCrearPasoInicial}"/>
                                        <p:commandButton id="btnPasoDependiente"
                                                         value="Agregar al paso seleccionado" icon="pi pi-sitemap"
                                                         actionListener="#{procedimientoModel.prepararPasoDependienteSeleccionado}"
                                                         process="@this" resetValues="true" update="panelPasos :frmProcedimiento:mensajes"
                                                         disabled="#{empty procedimientoModel.pasoNodoSeleccionado}"
                                                         rendered="#{not procedimientoModel.puedeCrearPasoInicial}"/>
                                    </div>
                                    <p:treeTable id="arbolPasos" value="#{procedimientoModel.arbolPasos}" var="paso"
                                                 emptyMessage="No se encontraron pasos" selectionMode="single"
                                                 selection="#{procedimientoModel.pasoNodoSeleccionado}">
                                        <p:ajax event="select" listener="#{procedimientoModel.onPasoNodoSelect}"
                                                update=":frmProcedimiento:tabsProcedimiento:btnPasoDependiente"/>
                                        <p:column headerText="Nombre">
                                            <h:outputText value="#{paso.nombre}"/>
                                        </p:column>
                                        <p:column headerText="ID">
                                            <h:outputText value="#{paso.idProcedimientoPaso}"/>
                                        </p:column>
                                        <p:column headerText="A cargo de">
                                            <h:outputText value="#{paso.idRol.nombre}"/>
                                        </p:column>
                                        <p:column headerText="Indica fin">
                                            <h:outputText value="#{paso.indicaFin ? 'Sí' : 'No'}"/>
                                        </p:column>
                                        <p:column headerText="Acciones" style="width:165px;text-align:center">
                                            <p:commandButton icon="pi pi-sitemap" title="Crear paso dependiente"
                                                             actionListener="#{procedimientoModel.prepararPasoDependiente(paso)}"
                                                             process="@this"
                                                             resetValues="true" update=":frmProcedimiento:tabsProcedimiento:panelPasos"
                                                             style="margin-right:4px"/>
                                            <p:commandButton icon="pi pi-pencil" title="Modificar paso"
                                                             actionListener="#{procedimientoModel.prepararEdicionPasoCompleto(paso)}"
                                                             process="@this"
                                                             resetValues="true" update=":frmProcedimiento:tabsProcedimiento:panelPasos"
                                                             style="margin-right:4px"/>
                                            <p:commandButton icon="pi pi-trash" title="Eliminar paso"
                                                             actionListener="#{procedimientoModel.eliminarPasoCompleto(paso)}"
                                                             process="@this"
                                                             update=":frmProcedimiento:tabsProcedimiento:panelPasos :frmProcedimiento:mensajes :avisos"
                                                             styleClass="ui-button-danger">
                                                <p:confirm header="Eliminar paso"
                                                           message="¿Desea eliminar el paso seleccionado?"
                                                           icon="pi pi-exclamation-triangle"/>
                                            </p:commandButton>
                                        </p:column>
                                    </p:treeTable>
                                </h:panelGroup>

                                <h:panelGroup rendered="#{procedimientoModel.capturandoPaso}">
                                    <div class="video-actions">
                                        <p:commandButton value="Cancelar Pasos" icon="pi pi-times"
                                                         actionListener="#{procedimientoModel.cancelarCapturaPaso}"
                                                         process="@this" resetValues="true" update="panelPasos"
                                                         styleClass="ui-button-secondary"/>
                                    </div>
                                    <h:panelGrid columns="3" cellpadding="4" styleClass="video-form-grid">
                                        <p:outputLabel for="idPaso" value="ID"/>
                                        <p:inputText id="idPaso" value="#{procedimientoModel.nuevoPaso.idProcedimientoPaso}"
                                                     size="52" disabled="true"/>
                                        <h:outputText/>

                                        <p:outputLabel for="nombrePaso" value="Nombre *"/>
                                        <p:inputText id="nombrePaso" value="#{procedimientoModel.nuevoPaso.nombre}"
                                                     size="52" required="true" maxlength="255"/>
                                        <h:outputText/>

                                        <p:outputLabel for="rolPaso" value="A cargo de *"/>
                                        <p:inputText id="rolPaso" value="#{procedimientoModel.nombreRolPaso}"
                                                     size="38" readonly="true" required="true"/>
                                        <p:commandButton type="button" value="Seleccionar Rol"
                                                         icon="pi pi-search" onclick="PF('dlgRoles').show()"/>

                                        <p:outputLabel for="dependePaso" value="Depende de *"/>
                                        <p:selectOneMenu id="dependePaso"
                                                         value="#{procedimientoModel.idPasoAnteriorSeleccionadoSecuencia}"
                                                         style="width:340px"
                                                         disabled="#{empty procedimientoModel.pasosDelProcedimiento}">
                                            <f:selectItem itemLabel="#{empty procedimientoModel.pasosDelProcedimiento ? 'Primer paso del procedimiento' : 'Seleccione un paso'}"
                                                          itemValue=""/>
                                            <f:selectItems value="#{procedimientoModel.pasosDelProcedimiento}" var="anterior"
                                                           itemLabel="#{anterior.nombre}" itemValue="#{anterior.idProcedimientoPaso}"/>
                                        </p:selectOneMenu>
                                        <h:outputText/>

                                        <p:outputLabel for="indicaFin" value="Indica finalización del procedimiento"/>
                                        <p:selectBooleanCheckbox id="indicaFin" value="#{procedimientoModel.nuevoPaso.indicaFin}"/>
                                        <h:outputText/>
                                    </h:panelGrid>

                                    <p:fieldset legend="Exámenes" styleClass="video-fieldset">
                                        <div class="video-actions">
                                            <p:commandButton type="button" value="Agregar Examen" icon="pi pi-plus"
                                                             onclick="PF('dlgExamenesPaso').show()"/>
                                            <p:commandButton id="btnEliminarExamenPaso"
                                                             value="Eliminar Seleccionado" icon="pi pi-trash"
                                                             actionListener="#{procedimientoModel.eliminarExamenSeleccionadoPaso}"
                                                             process="@this tablaExamenesPaso"
                                                             update="tablaExamenesPaso"
                                                             disabled="#{empty procedimientoModel.examenPasoSeleccionadoTemporal}"
                                                             styleClass="ui-button-danger"/>
                                        </div>
                                        <p:dataTable id="tablaExamenesPaso"
                                                     value="#{procedimientoModel.examenesSeleccionadosPaso}"
                                                     var="examenPaso" emptyMessage="No se requieren exámenes"
                                                     selectionMode="single"
                                                     selection="#{procedimientoModel.examenPasoSeleccionadoTemporal}"
                                                     rowKey="#{examenPaso.idExamen}">
                                            <p:ajax event="rowSelect"
                                                    update=":frmProcedimiento:tabsProcedimiento:btnEliminarExamenPaso"/>
                                            <p:column headerText="Examen"><h:outputText value="#{examenPaso.nombre}"/></p:column>
                                        </p:dataTable>
                                    </p:fieldset>
                                    <p:commandButton value="#{procedimientoModel.editandoPaso ? 'Modificar Paso' : 'Guardar Pasos'}"
                                                     icon="pi pi-save"
                                                     actionListener="#{procedimientoModel.guardarPasoCompleto}"
                                                     process="panelPasos" update=":frmProcedimiento:tabsProcedimiento:panelPasos :frmProcedimiento:mensajes :avisos"/>
                                </h:panelGroup>
                            </h:panelGroup>
                        </p:tab>
                    </p:tabView>
                </h:panelGroup>
            </h:panelGroup>

            <p:dialog header="Seleccionar Rol" widgetVar="dlgRoles" modal="true"
                      width="650" responsive="true">
                <p:dataTable value="#{procedimientoModel.roles}" var="rol"
                             emptyMessage="No hay roles activos">
                    <p:column headerText="Rol"><h:outputText value="#{rol.nombre}"/></p:column>
                    <p:column headerText="Descripción"><h:outputText value="#{rol.observaciones}"/></p:column>
                    <p:column style="width:100px">
                        <p:commandButton value="Seleccionar"
                                         actionListener="#{procedimientoModel.seleccionarRolPaso(rol)}"
                                         process="@this" update=":frmProcedimiento:tabsProcedimiento:rolPaso"
                                         oncomplete="PF('dlgRoles').hide()"/>
                    </p:column>
                </p:dataTable>
            </p:dialog>

            <p:dialog header="Agregar Examen" widgetVar="dlgExamenesPaso" modal="true"
                      width="650" responsive="true">
                <p:dataTable value="#{procedimientoModel.examenes}" var="examen"
                             emptyMessage="No hay exámenes activos" paginator="true" rows="8">
                    <p:column headerText="Examen"><h:outputText value="#{examen.nombre}"/></p:column>
                    <p:column headerText="Observaciones"><h:outputText value="#{examen.observaciones}"/></p:column>
                    <p:column style="width:100px">
                        <p:commandButton value="Agregar"
                                         actionListener="#{procedimientoModel.agregarExamenPaso(examen)}"
                                         process="@this"
                                         update=":frmProcedimiento:tabsProcedimiento:panelPasos"
                                         oncomplete="PF('dlgExamenesPaso').hide()"/>
                    </p:column>
                </p:dataTable>
            </p:dialog>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes"/>
            </p:confirmDialog>
        </h:form>
    </ui:define>
</ui:composition>
