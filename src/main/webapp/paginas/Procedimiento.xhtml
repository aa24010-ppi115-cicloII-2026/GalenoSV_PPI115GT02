<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['procedimiento.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['procedimiento.titulo']}</ui:define>
    <ui:define name="contenido">
        <h:panelGrid columns="1">
            <h:panelGroup id="pnlTabla" layout="block" rendered="#{procedimientoModel.estado eq 'NADA'}">
                <h:form id="frmTabla">
                    <g:botonesTop modelo="#{procedimientoModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                    <p:dataTable id="tabla" value="#{procedimientoModel.modelo}" var="r" lazy="true"
                                 paginator="true" rows="#{procedimientoModel.cantidadRegistros}" paginatorPosition="both"
                                 emptyMessage="#{msg['tabla.sinRegistros']}" selectionMode="single"
                                 selection="#{procedimientoModel.registro}" rowKey="#{r.idProcedimiento}">
                        <p:ajax event="rowSelect" listener="#{procedimientoModel.selectionHandler}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:column headerText="#{msg['tabla.id']}"><h:outputText value="#{r.idProcedimiento}"/></p:column>
                        <p:column headerText="#{msg['tabla.nombre']}"><h:outputText value="#{r.nombre}"/></p:column>
                        <p:column headerText="#{msg['tabla.activo']}"><h:outputText value="#{r.activo ? msg['tabla.activo'] : msg['tabla.inactivo']}"/></p:column>
                        <p:column headerText="#{msg['tabla.observaciones']}"><h:outputText value="#{r.observaciones}"/></p:column>
                    </p:dataTable>
                </h:form>
            </h:panelGroup>
            <h:panelGroup id="pnlDetalle" layout="block">
                <h:form id="frmDetalle" rendered="#{procedimientoModel.estado ne 'NADA'}">
                    <g:botonesTop modelo="#{procedimientoModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                    <h:panelGrid columns="2" cellpadding="5">
                        <p:outputLabel for="txtId" value="#{msg['procedimiento.form.id']}"/>
                        <p:inputText id="txtId" value="#{procedimientoModel.registro.idProcedimiento}" size="50" disabled="true"/>
                        <p:outputLabel for="txtNombre" value="#{msg['procedimiento.form.nombre']}"/>
                        <p:inputText id="txtNombre" value="#{procedimientoModel.registro.nombre}" size="50" maxlength="155" required="true"/>
                        <p:outputLabel for="chkActivo" value="#{msg['procedimiento.form.activo']}"/>
                        <p:toggleSwitch id="chkActivo" value="#{procedimientoModel.registro.activo}"/>
                        <p:outputLabel for="txtObservaciones" value="#{msg['procedimiento.form.observaciones']}"/>
                        <p:inputTextarea id="txtObservaciones" value="#{procedimientoModel.registro.observaciones}" rows="4" cols="50"/>
                    </h:panelGrid>
                    <h:panelGrid columns="#{procedimientoModel.estado eq 'CREAR' ? 1 : 2}">
                        <p:commandButton id="btnGuardar" value="#{msg['boton.guardar']}" actionListener="#{procedimientoModel.btnGuardarHandler}" rendered="#{procedimientoModel.estado eq 'CREAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:commandButton id="btnModificar" value="#{msg['boton.modificar']}" actionListener="#{procedimientoModel.btnModificarHandler}" rendered="#{procedimientoModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:commandButton id="btnEliminar" value="#{msg['boton.eliminar']}" actionListener="#{procedimientoModel.btnEliminarHandler}" rendered="#{procedimientoModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>
        </h:panelGrid>
    </ui:define>
</ui:composition>
