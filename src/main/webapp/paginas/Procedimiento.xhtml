<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">Gestión de Procedimientos Médicos - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">Gestión de Procedimientos Médicos</ui:define>
    <ui:define name="contenido">
        <h:form id="frmProcedimiento">
            <p:messages id="mensajes" showDetail="true" closable="true"/>

            <h:panelGrid columns="1" style="width:100%">
                <!-- Panel Principal (Maestro) -->
                <h:panelGroup id="pnlTabla" layout="block" rendered="#{procedimientoModel.estado eq 'NADA'}">
                    <g:botonesTop modelo="#{procedimientoModel}" actualizar=":frmProcedimiento"/>
                    <p:dataTable id="tabla" value="#{procedimientoModel.modelo}" var="r" lazy="true"
                                 paginator="true" rows="#{procedimientoModel.cantidadRegistros}" paginatorPosition="bottom"
                                 emptyMessage="#{msg['tabla.sinRegistros']}" selectionMode="single"
                                 selection="#{procedimientoModel.registro}" rowKey="#{r.idProcedimiento}">
                        <p:ajax event="rowSelect" listener="#{procedimientoModel.selectionHandler}" update=":frmProcedimiento"/>
                        <p:column headerText="#{msg['tabla.nombre']}"><h:outputText value="#{r.nombre}"/></p:column>
                        <p:column headerText="#{msg['tabla.activo']}"><h:outputText value="#{r.activo ? msg['tabla.si'] : msg['tabla.no']}"/></p:column>
                    </p:dataTable>
                </h:panelGroup>

                <!-- Panel de Detalle (Maestro-Detalle) -->
                <h:panelGroup id="pnlDetalle" layout="block" rendered="#{procedimientoModel.estado ne 'NADA'}">
                    <g:botonesTop modelo="#{procedimientoModel}" actualizar=":frmProcedimiento"/>
                    <p:panel header="#{msg['procedimiento.panel.maestro']}">
                        <h:panelGrid columns="2" cellpadding="5">
                            <p:outputLabel for="txtId" value="#{msg['tabla.id']}"/>
                            <p:inputText id="txtId" value="#{procedimientoModel.registro.idProcedimiento}" size="50" disabled="true"/>
                            <p:outputLabel for="txtNombre" value="#{msg['procedimiento.form.nombre']} *"/>
                            <p:inputText id="txtNombre" value="#{procedimientoModel.registro.nombre}" size="50" required="true" maxlength="255"/>
                            <p:outputLabel for="chkActivo" value="#{msg['procedimiento.form.activo']}"/>
                            <p:selectBooleanCheckbox id="chkActivo" value="#{procedimientoModel.registro.activo}"/>
                            <p:outputLabel for="txtObservaciones" value="#{msg['procedimiento.form.observaciones']}"/>
                            <p:inputTextarea id="txtObservaciones" value="#{procedimientoModel.registro.observaciones}" rows="3" cols="50" maxlength="1000"/>
                        </h:panelGrid>
                        
                        <h:panelGrid columns="#{procedimientoModel.estado eq 'CREAR' ? 1 : 2}">
                            <p:commandButton value="#{msg['boton.guardar']}" actionListener="#{procedimientoModel.btnGuardarHandler}" rendered="#{procedimientoModel.estado eq 'CREAR'}" update=":frmProcedimiento" styleClass="ui-button-success" process="@this txtId txtNombre chkActivo txtObservaciones"/>
                            <p:commandButton value="#{msg['boton.modificar']}" actionListener="#{procedimientoModel.btnModificarHandler}" rendered="#{procedimientoModel.estado eq 'MODIFICAR'}" update=":frmProcedimiento" styleClass="ui-button-primary" process="@this txtId txtNombre chkActivo txtObservaciones"/>
                            <p:commandButton value="#{msg['boton.eliminar']}" actionListener="#{procedimientoModel.btnEliminarHandler}" rendered="#{procedimientoModel.estado eq 'MODIFICAR'}" update=":frmProcedimiento" styleClass="ui-button-danger" process="@this">
                                <p:confirm header="#{msg['confirm.titulo']}" message="#{msg['confirm.eliminar']}" icon="pi pi-info-circle"/>
                            </p:commandButton>
                            
                            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                                <p:commandButton value="#{msg['confirm.no']}" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                                <p:commandButton value="#{msg['confirm.si']}" type="button" styleClass="ui-confirmdialog-yes" />
                            </p:confirmDialog>
                        </h:panelGrid>
                    </p:panel>

                    <!-- Pestañas (Detalle) -->
                    <h:panelGroup rendered="#{procedimientoModel.estado eq 'MODIFICAR'}">
                        <p:tabView style="margin-top:20px;">
                            
                            <!-- ─── Pestaña 1: Pasos ─── -->
                            <p:tab title="#{msg['procedimiento.tab.pasos']}">
                                <h:panelGroup id="panelNuevoPaso" style="margin-bottom:15px; display:block;">
                                    <h:panelGrid columns="9" cellpadding="5" styleClass="ui-fluid">
                                        <p:outputLabel value="#{msg['procedimientoPaso.form.nombre']}:"/>
                                        <p:inputText value="#{procedimientoModel.nuevoPaso.nombre}" size="20" required="true" maxlength="255"/>

                                        <p:outputLabel value="#{msg['procedimientoPaso.form.rol']}:"/>
                                        <p:selectOneMenu value="#{procedimientoModel.idRolSeleccionadoPaso}" style="width:150px">
                                            <f:selectItem itemLabel="#{msg['procedimiento.form.cualquiera']}" itemValue=""/>
                                            <f:selectItems value="#{procedimientoModel.roles}" var="rol"
                                                           itemLabel="#{rol.nombre}" itemValue="#{rol.idRol}"/>
                                        </p:selectOneMenu>

                                        <p:outputLabel value="#{msg['procedimientoPaso.form.indicaFin']}:"/>
                                        <p:selectBooleanCheckbox value="#{procedimientoModel.nuevoPaso.indicaFin}"/>

                                        <p:commandButton value="#{msg['boton.agregar']}" icon="pi pi-plus"
                                                         actionListener="#{procedimientoModel.agregarPaso()}"
                                                         process="panelNuevoPaso"
                                                         update="panelNuevoPaso tablaPasos :frmProcedimiento:mensajes @([id$=cmbPasoSecuenciaPrincipal]) @([id$=cmbPasoSecuenciaAnterior]) @([id$=cmbPasoExamenPrincipal]) :avisos"
                                                         styleClass="ui-button-info" rendered="#{not procedimientoModel.editandoPaso}"/>
                                                         
                                        <p:commandButton value="#{msg['boton.guardar']}" icon="pi pi-pencil"
                                                         actionListener="#{procedimientoModel.modificarPaso()}"
                                                         process="panelNuevoPaso"
                                                         update="panelNuevoPaso tablaPasos :frmProcedimiento:mensajes @([id$=cmbPasoSecuenciaPrincipal]) @([id$=cmbPasoSecuenciaAnterior]) @([id$=cmbPasoExamenPrincipal]) :avisos"
                                                         styleClass="ui-button-warning" rendered="#{procedimientoModel.editandoPaso}"/>

                                        <p:commandButton value="#{msg['boton.cancelar']}" icon="pi pi-times"
                                                         actionListener="#{procedimientoModel.cancelarEdicionPaso()}"
                                                         process="@this"
                                                         update="panelNuevoPaso tablaPasos"
                                                         styleClass="ui-button-secondary" rendered="#{procedimientoModel.editandoPaso}"/>
                                    </h:panelGrid>
                                </h:panelGroup>

                                <p:dataTable id="tablaPasos" value="#{procedimientoModel.pasosDelProcedimiento}"
                                             var="paso" emptyMessage="#{msg['tabla.sinRegistros']}"
                                             selectionMode="single" selection="#{procedimientoModel.pasoSeleccionado}"
                                             rowKey="#{paso.idProcedimientoPaso}">
                                             
                                    <p:ajax event="rowSelect" listener="#{procedimientoModel.onPasoSelect}" update="panelNuevoPaso"/>
                                    
                                    <p:column headerText="#{msg['procedimientoPaso.form.nombre']}">
                                        <h:outputText value="#{paso.nombre}"/>
                                    </p:column>
                                    <p:column headerText="#{msg['procedimientoPaso.tabla.rol']}">
                                        <h:outputText value="#{paso.idRol != null ? paso.idRol.nombre : 'Cualquiera'}"/>
                                    </p:column>
                                    <p:column headerText="#{msg['procedimientoPaso.tabla.indicaFin']}">
                                        <h:outputText value="#{paso.indicaFin ? msg['tabla.si'] : msg['tabla.no']}"/>
                                    </p:column>
                                    <p:column headerText="#{msg['tabla.accion']}" width="100" style="text-align:center;">
                                        <p:commandButton icon="pi pi-trash" styleClass="ui-button-danger rounded-button"
                                                         actionListener="#{procedimientoModel.eliminarPaso(paso)}"
                                                         process="@this"
                                                         update="tablaPasos panelNuevoPaso :frmProcedimiento:mensajes @([id$=cmbPasoSecuenciaPrincipal]) @([id$=cmbPasoSecuenciaAnterior]) @([id$=cmbPasoExamenPrincipal]) :avisos">
                                            <p:confirm header="#{msg['confirm.titulo']}" message="#{msg['confirm.eliminar']}" icon="pi pi-info-circle"/>
                                        </p:commandButton>
                                    </p:column>
                                </p:dataTable>
                            </p:tab>

                            <!-- ─── Pestaña 2: Secuencias ─── -->
                            <p:tab title="#{msg['procedimiento.tab.secuencia']}">
                                <h:panelGroup id="panelNuevaSecuencia" style="margin-bottom:15px; display:block;">
                                    <h:panelGrid columns="7" cellpadding="5" styleClass="ui-fluid">
                                        <p:outputLabel value="#{msg['procedimiento.form.pasoPrincipal']}:"/>
                                        <p:selectOneMenu id="cmbPasoSecuenciaPrincipal" value="#{procedimientoModel.idPasoSeleccionadoSecuencia}" style="width:200px" required="true" requiredMessage="#{msg['procedimiento.validacion.pasoPrincipal']}">
                                            <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                                            <f:selectItems value="#{procedimientoModel.pasosDelProcedimiento}" var="p"
                                                           itemLabel="#{p.nombre}" itemValue="#{p.idProcedimientoPaso}"/>
                                        </p:selectOneMenu>

                                        <p:outputLabel value="#{msg['procedimiento.form.despuesDe']}:"/>
                                        <p:selectOneMenu id="cmbPasoSecuenciaAnterior" value="#{procedimientoModel.idPasoAnteriorSeleccionadoSecuencia}" style="width:200px">
                                            <f:selectItem itemLabel="#{msg['procedimientoPasoSecuencia.form.sinReferencia']}" itemValue=""/>
                                            <f:selectItems value="#{procedimientoModel.pasosDelProcedimiento}" var="p"
                                                           itemLabel="#{p.nombre}" itemValue="#{p.idProcedimientoPaso}"/>
                                        </p:selectOneMenu>

                                        <p:commandButton value="#{msg['boton.enlazar']}" icon="pi pi-link"
                                                         actionListener="#{procedimientoModel.agregarSecuencia()}"
                                                         process="panelNuevaSecuencia"
                                                         update="panelNuevaSecuencia tablaSecuencias :frmProcedimiento:mensajes :avisos"
                                                         styleClass="ui-button-info" rendered="#{not procedimientoModel.editandoSecuencia}"/>

                                        <p:commandButton value="#{msg['boton.guardar']}" icon="pi pi-pencil"
                                                         actionListener="#{procedimientoModel.modificarSecuencia()}"
                                                         process="panelNuevaSecuencia"
                                                         update="panelNuevaSecuencia tablaSecuencias :frmProcedimiento:mensajes :avisos"
                                                         styleClass="ui-button-warning" rendered="#{procedimientoModel.editandoSecuencia}"/>

                                        <p:commandButton value="#{msg['boton.cancelar']}" icon="pi pi-times"
                                                         actionListener="#{procedimientoModel.cancelarEdicionSecuencia()}"
                                                         process="@this"
                                                         update="panelNuevaSecuencia tablaSecuencias"
                                                         styleClass="ui-button-secondary" rendered="#{procedimientoModel.editandoSecuencia}"/>
                                    </h:panelGrid>
                                </h:panelGroup>

                                <p:dataTable id="tablaSecuencias" value="#{procedimientoModel.secuenciasDelProcedimiento}"
                                             var="sec" emptyMessage="#{msg['tabla.sinRegistros']}"
                                             selectionMode="single" selection="#{procedimientoModel.secuenciaSeleccionada}"
                                             rowKey="#{sec.idProcedimientoPasoSecuencia}">
                                             
                                    <p:ajax event="rowSelect" listener="#{procedimientoModel.onSecuenciaSelect}" update="panelNuevaSecuencia"/>
                                    
                                    <p:column headerText="#{msg['procedimiento.form.pasoPrincipal']}">
                                        <h:outputText value="#{procedimientoModel.nombrePaso(sec.idProcedimientoPaso.idProcedimientoPaso)}"/>
                                    </p:column>
                                    <p:column headerText="#{msg['procedimiento.tabla.relacion']}">
                                        <h:outputText value="#{msg['procedimiento.relacion.despues']}"/>
                                    </p:column>
                                    <p:column headerText="#{msg['procedimientoPasoSecuencia.tabla.referencia']}">
                                        <h:outputText value="#{procedimientoModel.nombrePaso(sec.idProcedimientoPasoReferencia)}"/>
                                    </p:column>
                                    <p:column headerText="#{msg['tabla.accion']}" width="100" style="text-align:center;">
                                        <p:commandButton icon="pi pi-trash" styleClass="ui-button-danger rounded-button"
                                                         actionListener="#{procedimientoModel.eliminarSecuencia(sec)}"
                                                         process="@this"
                                                         update="tablaSecuencias panelNuevaSecuencia :frmProcedimiento:mensajes :avisos">
                                            <p:confirm header="#{msg['confirm.titulo']}" message="#{msg['confirm.eliminar']}" icon="pi pi-info-circle"/>
                                        </p:commandButton>
                                    </p:column>
                                </p:dataTable>
                            </p:tab>

                            <!-- ─── Pestaña 3: Exámenes Requeridos ─── -->
                            <p:tab title="#{msg['procedimiento.tab.examenes']}">
                                <h:panelGroup id="panelNuevoExamen" style="margin-bottom:15px; display:block;">
                                    <h:panelGrid columns="7" cellpadding="5" styleClass="ui-fluid">
                                        <p:outputLabel value="#{msg['procedimiento.form.pasoPrincipal']}:"/>
                                        <p:selectOneMenu id="cmbPasoExamenPrincipal" value="#{procedimientoModel.idPasoSeleccionadoExamen}" style="width:200px" required="true" requiredMessage="#{msg['procedimiento.seleccione.paso']}">
                                            <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                                            <f:selectItems value="#{procedimientoModel.pasosDelProcedimiento}" var="p"
                                                           itemLabel="#{p.nombre}" itemValue="#{p.idProcedimientoPaso}"/>
                                        </p:selectOneMenu>

                                        <p:outputLabel value="#{msg['procedimiento.form.examenSolicitar']}:"/>
                                        <p:selectOneMenu value="#{procedimientoModel.idExamenSeleccionado}" style="width:200px" required="true" requiredMessage="#{msg['procedimiento.seleccione.examen']}">
                                            <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                                            <f:selectItems value="#{procedimientoModel.examenes}" var="ex"
                                                           itemLabel="#{ex.nombre}" itemValue="#{ex.idExamen}"/>
                                        </p:selectOneMenu>

                                        <p:commandButton value="#{msg['boton.vincularExamen']}" icon="pi pi-check-square"
                                                         actionListener="#{procedimientoModel.agregarPasoExamen()}"
                                                         process="panelNuevoExamen"
                                                         update="panelNuevoExamen tablaExamenes :frmProcedimiento:mensajes :avisos"
                                                         styleClass="ui-button-info" rendered="#{not procedimientoModel.editandoExamen}"/>

                                        <p:commandButton value="#{msg['boton.guardar']}" icon="pi pi-pencil"
                                                         actionListener="#{procedimientoModel.modificarPasoExamen()}"
                                                         process="panelNuevoExamen"
                                                         update="panelNuevoExamen tablaExamenes :frmProcedimiento:mensajes :avisos"
                                                         styleClass="ui-button-warning" rendered="#{procedimientoModel.editandoExamen}"/>

                                        <p:commandButton value="#{msg['boton.cancelar']}" icon="pi pi-times"
                                                         actionListener="#{procedimientoModel.cancelarEdicionExamen()}"
                                                         process="@this"
                                                         update="panelNuevoExamen tablaExamenes"
                                                         styleClass="ui-button-secondary" rendered="#{procedimientoModel.editandoExamen}"/>
                                    </h:panelGrid>
                                </h:panelGroup>

                                <p:dataTable id="tablaExamenes" value="#{procedimientoModel.examenesDelProcedimiento}"
                                             var="ppe" emptyMessage="#{msg['tabla.sinRegistros']}"
                                             selectionMode="single" selection="#{procedimientoModel.examenSeleccionado}"
                                             rowKey="#{ppe.idProcedimientoPasoExamen}">
                                             
                                    <p:ajax event="rowSelect" listener="#{procedimientoModel.onExamenSelect}" update="panelNuevoExamen"/>
                                    
                                    <p:column headerText="#{msg['procedimiento.form.pasoPrincipal']}">
                                        <h:outputText value="#{procedimientoModel.nombrePaso(ppe.idProcedimientoPaso.idProcedimientoPaso)}"/>
                                    </p:column>
                                    <p:column headerText="#{msg['procedimientoPasoExamen.tabla.examen']}">
                                        <h:outputText value="#{ppe.idExamen.nombre}"/>
                                    </p:column>
                                    <p:column headerText="#{msg['procedimientoPasoExamen.form.activo']}">
                                        <h:outputText value="#{ppe.activo ? msg['tabla.si'] : msg['tabla.no']}"/>
                                    </p:column>
                                    <p:column headerText="#{msg['tabla.accion']}" width="100" style="text-align:center;">
                                        <p:commandButton icon="pi pi-trash" styleClass="ui-button-danger rounded-button"
                                                         actionListener="#{procedimientoModel.eliminarPasoExamen(ppe)}"
                                                         process="@this"
                                                         update="tablaExamenes panelNuevoExamen :frmProcedimiento:mensajes :avisos">
                                            <p:confirm header="#{msg['confirm.titulo']}" message="#{msg['confirm.eliminar']}" icon="pi pi-info-circle"/>
                                        </p:commandButton>
                                    </p:column>
                                </p:dataTable>
                            </p:tab>

                        </p:tabView>
                    </h:panelGroup>
                </h:panelGroup>
            </h:panelGrid>
        </h:form>
    </ui:define>
</ui:composition>
