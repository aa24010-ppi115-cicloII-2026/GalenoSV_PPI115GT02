<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['error.404.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['error.404.titulo']}</ui:define>
    <ui:define name="contenido">
        <div class="welcome-intro">
            <div>
                <span class="welcome-kicker">404</span>
                <h2>#{msg['error.404.titulo']}</h2>
                <p>#{msg['error.404.mensaje']}</p>
            </div>
        </div>
        <p style="margin-top:16px">
            <p:button value="#{msg['menu.inicio']}" outcome="/paginas/Inicio" icon="pi pi-home"/>
        </p>
    </ui:define>
</ui:composition>
