<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['rol.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['rol.titulo']}</ui:define>
    <ui:define name="contenido">
        <h:panelGrid columns="1">
            <h:panelGroup id="pnlTabla" layout="block" rendered="#{rolModel.estado eq 'NADA'}">
                <h:form id="frmTabla">
                    <h:panelGrid columns="1">
                        <g:botonesTop modelo="#{rolModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:dataTable id="tabla" value="#{rolModel.modelo}" var="r" lazy="true"
                                     paginator="true" rows="#{rolModel.cantidadRegistros}"
                                     paginatorPosition="both" emptyMessage="#{msg['tabla.sinRegistros']}"
                                     selectionMode="single" selection="#{rolModel.registro}" rowKey="#{r.idRol}">
                            <p:ajax event="rowSelect" listener="#{rolModel.selectionHandler}"
                                    update=":pnlTabla :pnlDetalle :mensajes"/>
                            <p:column headerText="#{msg['tabla.id']}"><h:outputText value="#{r.idRol}"/></p:column>
                            <p:column headerText="#{msg['tabla.nombre']}"><h:outputText value="#{r.nombre}"/></p:column>
                            <p:column headerText="#{msg['tabla.activo']}"><h:outputText value="#{r.activo ? msg['tabla.activo'] : msg['tabla.inactivo']}"/></p:column>
                            <p:column headerText="#{msg['tabla.observaciones']}"><h:outputText value="#{r.observaciones}"/></p:column>
                        </p:dataTable>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>
            <h:panelGroup id="pnlDetalle" layout="block">
                <h:form id="frmDetalle" rendered="#{rolModel.estado ne 'NADA'}">
                    <h:panelGrid columns="1">
                        <g:botonesTop modelo="#{rolModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                        <h:panelGrid columns="2" cellpadding="5">
                            <p:outputLabel for="txtId" value="#{msg['rol.form.id']}"/>
                            <p:inputText id="txtId" value="#{rolModel.registro.idRol}" size="50" disabled="true"/>
                            <p:outputLabel for="txtNombre" value="#{msg['rol.form.nombre']}"/>
                            <p:inputText id="txtNombre" value="#{rolModel.registro.nombre}" required="true"
                                         requiredMessage="#{msg['rol.nombre.requerido']}" size="50" maxlength="155"/>
                            <p:outputLabel for="swActivo" value="#{msg['rol.form.activo']}"/>
                            <p:toggleSwitch id="swActivo" value="#{rolModel.registro.activo}"/>
                            <p:outputLabel for="txtObservaciones" value="#{msg['rol.form.observaciones']}"/>
                            <p:inputTextarea id="txtObservaciones" value="#{rolModel.registro.observaciones}" rows="3" cols="50"/>
                        </h:panelGrid>
                        <h:panelGrid columns="#{rolModel.estado eq 'CREAR' ? 1 : 2}">
                            <p:commandButton id="btnGuardar" value="#{msg['boton.guardar']}" actionListener="#{rolModel.btnGuardarHandler}" rendered="#{rolModel.estado eq 'CREAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                            <p:commandButton id="btnModificar" value="#{msg['boton.modificar']}" actionListener="#{rolModel.btnModificarHandler}" rendered="#{rolModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                            <p:commandButton id="btnEliminar" value="#{msg['boton.eliminar']}" actionListener="#{rolModel.btnEliminarHandler}" rendered="#{rolModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        </h:panelGrid>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>
        </h:panelGrid>
    </ui:define>
</ui:composition>
