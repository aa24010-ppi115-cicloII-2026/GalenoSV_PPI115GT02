<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['tipoDocumento.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['tipoDocumento.titulo']}</ui:define>
    <ui:define name="contenido">
        <h:panelGrid columns="1">
            <h:panelGroup id="pnlTabla" layout="block" rendered="#{tipoDocumentoModel.estado eq 'NADA'}">
                <h:form id="frmTabla">
                    <h:panelGrid columns="1">
                        <g:botonesTop modelo="#{tipoDocumentoModel}"
                                      actualizar=":pnlTabla :pnlDetalle :mensajes"/>

                        <p:dataTable id="tabla"
                                     value="#{tipoDocumentoModel.modelo}"
                                     var="r"
                                     lazy="true"
                                     paginator="true"
                                     rows="#{tipoDocumentoModel.cantidadRegistros}"
                                     paginatorPosition="both"
                                     emptyMessage="#{msg['tabla.sinRegistros']}"
                                     selectionMode="single"
                                     selection="#{tipoDocumentoModel.registro}"
                                     rowKey="#{r.idTipoDocumento}">
                            <p:ajax event="rowSelect"
                                    listener="#{tipoDocumentoModel.selectionHandler}"
                                    update=":pnlTabla :pnlDetalle :mensajes"/>

                            <p:column headerText="#{msg['tabla.id']}">
                                <h:outputText value="#{r.idTipoDocumento}"/>
                            </p:column>
                            <p:column headerText="#{msg['tabla.nombre']}">
                                <h:outputText value="#{r.nombre}"/>
                            </p:column>
                            <p:column headerText="#{msg['tipoDocumento.tabla.expresionRegular']}">
                                <h:outputText value="#{r.expresionRegular}"/>
                            </p:column>
                            <p:column headerText="#{msg['tabla.activo']}">
                                <h:outputText value="#{r.activo ? msg['tabla.activo'] : msg['tabla.inactivo']}"/>
                            </p:column>
                            <p:column headerText="#{msg['tipoDocumento.tabla.indicaciones']}">
                                <h:outputText value="#{r.indicaciones}"/>
                            </p:column>
                        </p:dataTable>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>

            <h:panelGroup id="pnlDetalle" layout="block">
                <h:form id="frmDetalle" rendered="#{tipoDocumentoModel.estado ne 'NADA'}">
                    <h:panelGrid columns="1">
                        <g:botonesTop modelo="#{tipoDocumentoModel}"
                                      actualizar=":pnlTabla :pnlDetalle :mensajes"/>

                        <h:panelGrid columns="2" cellpadding="5">
                            <p:outputLabel for="txtId" value="#{msg['tipoDocumento.form.id']}"/>
                            <p:inputText id="txtId"
                                         value="#{tipoDocumentoModel.registro.idTipoDocumento}"
                                         size="50"
                                         disabled="true"/>

                            <p:outputLabel for="txtNombre" value="#{msg['tipoDocumento.form.nombre']}"/>
                            <p:inputText id="txtNombre"
                                         value="#{tipoDocumentoModel.registro.nombre}"
                                         required="true"
                                         requiredMessage="#{msg['tipoDocumento.nombre.requerido']}"
                                         size="50"
                                         maxlength="155"/>

                            <p:outputLabel for="swActivo" value="#{msg['tipoDocumento.form.activo']}"/>
                            <p:toggleSwitch id="swActivo"
                                            value="#{tipoDocumentoModel.registro.activo}"/>

                            <p:outputLabel for="txtExpresionRegular" value="#{msg['tipoDocumento.form.expresionRegular']}"/>
                            <p:inputText id="txtExpresionRegular"
                                         value="#{tipoDocumentoModel.registro.expresionRegular}"
                                         required="true"
                                         requiredMessage="#{msg['tipoDocumento.expresionRegular.requerida']}"
                                         size="50"/>
                            <p:tooltip for="txtExpresionRegular"
                                       value="#{msg['tipoDocumento.tooltip.expresionRegular']}"/>

                            <p:outputLabel for="txtIndicaciones" value="#{msg['tipoDocumento.form.indicaciones']}"/>
                            <p:inputTextarea id="txtIndicaciones"
                                             value="#{tipoDocumentoModel.registro.indicaciones}"
                                             rows="3"
                                             cols="50"/>
                        </h:panelGrid>

                        <h:panelGrid columns="#{tipoDocumentoModel.estado eq 'CREAR' ? 1 : 2}">
                            <p:commandButton id="btnGuardar"
                                             value="#{msg['boton.guardar']}"
                                             actionListener="#{tipoDocumentoModel.btnGuardarHandler}"
                                             rendered="#{tipoDocumentoModel.estado eq 'CREAR'}"
                                             update=":pnlTabla :pnlDetalle :mensajes"/>
                            <p:commandButton id="btnModificar"
                                             value="#{msg['boton.modificar']}"
                                             actionListener="#{tipoDocumentoModel.btnModificarHandler}"
                                             rendered="#{tipoDocumentoModel.estado eq 'MODIFICAR'}"
                                             update=":pnlTabla :pnlDetalle :mensajes"/>
                            <p:commandButton id="btnEliminar"
                                             value="#{msg['boton.eliminar']}"
                                             actionListener="#{tipoDocumentoModel.btnEliminarHandler}"
                                             rendered="#{tipoDocumentoModel.estado eq 'MODIFICAR'}"
                                             update=":pnlTabla :pnlDetalle :mensajes"/>
                        </h:panelGrid>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>
        </h:panelGrid>
    </ui:define>
</ui:composition>
