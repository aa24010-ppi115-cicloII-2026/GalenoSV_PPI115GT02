<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['tipoMedioContacto.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['tipoMedioContacto.titulo']}</ui:define>
    <ui:define name="contenido">
    <h:panelGrid columns="1">
        <h:panelGroup id="pnlTabla" layout="block" rendered="#{tipoMedioContactoModel.estado eq 'NADA'}">
            <h:form id="frmTabla">
                <h:panelGrid columns="1">
                    <g:botonesTop modelo="#{tipoMedioContactoModel}"
                                  actualizar=":pnlTabla :pnlDetalle :mensajes"/>

                    <p:dataTable id="tabla"
                                 value="#{tipoMedioContactoModel.modelo}"
                                 var="r"
                                 lazy="true"
                                 paginator="true"
                                 rows="#{tipoMedioContactoModel.cantidadRegistros}"
                                 paginatorPosition="both"
                                 emptyMessage="#{msg['tabla.sinRegistros']}"
                                 selectionMode="single"
                                 selection="#{tipoMedioContactoModel.registro}"
                                 rowKey="#{r.idTipoMedioContacto}">
                        <p:ajax event="rowSelect"
                                listener="#{tipoMedioContactoModel.selectionHandler}"
                                update=":pnlTabla :pnlDetalle :mensajes"/>

                        <p:column headerText="#{msg['tabla.id']}">
                            <h:outputText value="#{r.idTipoMedioContacto}"/>
                        </p:column>
                        <p:column headerText="#{msg['tabla.nombre']}">
                            <h:outputText value="#{r.nombre}"/>
                        </p:column>
                        <p:column headerText="#{msg['tipoMedioContacto.form.activo']}">
                            <h:outputText value="#{r.activo ? msg['tabla.activo'] : msg['tabla.inactivo']}"/>
                        </p:column>
                        <p:column headerText="#{msg['tipoMedioContacto.tabla.expresionRegular']}">
                            <h:outputText value="#{r.expresionRegular}"/>
                        </p:column>
                        <p:column headerText="#{msg['tipoMedioContacto.tabla.indicaciones']}">
                            <h:outputText value="#{r.indicaciones}"/>
                        </p:column>
                    </p:dataTable>
                </h:panelGrid>
            </h:form>
        </h:panelGroup>

        <h:panelGroup id="pnlDetalle" layout="block">
            <h:form id="frmDetalle" rendered="#{tipoMedioContactoModel.estado ne 'NADA'}">
                <h:panelGrid columns="1">
                    <g:botonesTop modelo="#{tipoMedioContactoModel}"
                                  actualizar=":pnlTabla :pnlDetalle :mensajes"/>

                    <h:panelGrid columns="2" cellpadding="5">
                        <p:outputLabel for="txtId" value="#{msg['tipoMedioContacto.form.id']}"/>
                        <p:inputText id="txtId"
                                     value="#{tipoMedioContactoModel.registro.idTipoMedioContacto}"
                                     size="50"
                                     disabled="true"/>

                        <p:outputLabel for="txtNombre" value="#{msg['tipoMedioContacto.form.nombre']}"/>
                        <p:inputText id="txtNombre"
                                     value="#{tipoMedioContactoModel.registro.nombre}"
                                     required="true"
                                     requiredMessage="#{msg['tipoMedioContacto.nombre.requerido']}"
                                     size="50"
                                     maxlength="155"/>

                        <p:outputLabel for="swActivo" value="#{msg['tipoMedioContacto.form.activo']}"/>
                        <p:toggleSwitch id="swActivo"
                                        value="#{tipoMedioContactoModel.registro.activo}"/>

                        <p:outputLabel for="txtExpresionRegular" value="#{msg['tipoMedioContacto.form.expresionRegular']}"/>
                        <p:inputText id="txtExpresionRegular"
                                     value="#{tipoMedioContactoModel.registro.expresionRegular}"
                                     required="true"
                                     requiredMessage="#{msg['tipoMedioContacto.expresionRegular.requerida']}"
                                     size="50"/>
                        <p:tooltip for="txtExpresionRegular"
                                   value="#{msg['tipoMedioContacto.tooltip.expresionRegular']}"/>

                        <p:outputLabel for="txtIndicaciones" value="#{msg['tipoMedioContacto.form.indicaciones']}"/>
                        <p:inputTextarea id="txtIndicaciones"
                                         value="#{tipoMedioContactoModel.registro.indicaciones}"
                                         rows="3"
                                         cols="50"/>
                    </h:panelGrid>

                    <h:panelGrid columns="#{tipoMedioContactoModel.estado eq 'CREAR' ? 1 : 2}">
                        <p:commandButton id="btnGuardar"
                                         value="#{msg['boton.guardar']}"
                                         actionListener="#{tipoMedioContactoModel.btnGuardarHandler}"
                                         rendered="#{tipoMedioContactoModel.estado eq 'CREAR'}"
                                         update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:commandButton id="btnModificar"
                                         value="#{msg['boton.modificar']}"
                                         actionListener="#{tipoMedioContactoModel.btnModificarHandler}"
                                         rendered="#{tipoMedioContactoModel.estado eq 'MODIFICAR'}"
                                         update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:commandButton id="btnEliminar"
                                         value="#{msg['boton.eliminar']}"
                                         actionListener="#{tipoMedioContactoModel.btnEliminarHandler}"
                                         rendered="#{tipoMedioContactoModel.estado eq 'MODIFICAR'}"
                                         update=":pnlTabla :pnlDetalle :mensajes"/>
                    </h:panelGrid>
                </h:panelGrid>
            </h:form>
        </h:panelGroup>
    </h:panelGrid>
    </ui:define>
</ui:composition>
