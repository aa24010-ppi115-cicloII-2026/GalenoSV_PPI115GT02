<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['examenResultado.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['examenResultado.titulo']}</ui:define>
    <ui:define name="contenido">
        <h:panelGrid columns="1">
            <h:panelGroup id="pnlTabla" layout="block" rendered="#{examenResultadoModel.estado eq 'NADA'}">
                <h:form id="frmTabla">
                    <g:botonesTop modelo="#{examenResultadoModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                    <p:dataTable id="tabla" value="#{examenResultadoModel.modelo}" var="r" lazy="true"
                                 paginator="true" rows="#{examenResultadoModel.cantidadRegistros}" paginatorPosition="both"
                                 emptyMessage="#{msg['tabla.sinRegistros']}" selectionMode="single"
                                 selection="#{examenResultadoModel.registro}" rowKey="#{r.idExamenResultado}">
                        <p:ajax event="rowSelect" listener="#{examenResultadoModel.selectionHandler}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:column headerText="#{msg['tabla.id']}"><h:outputText value="#{r.idExamenResultado}"/></p:column>
                        <p:column headerText="#{msg['examenResultado.tabla.ordenExamen']}"><h:outputText value="#{r.idOrdenExamen.idOrdenExamen}"/></p:column>
                        <p:column headerText="#{msg['examenResultado.tabla.fechaCreacion']}"><h:outputText value="#{r.fechaCreacion}"/></p:column>
                        <p:column headerText="#{msg['examenResultado.tabla.resultado']}"><h:outputText value="#{r.resultado}"/></p:column>
                        <p:column headerText="#{msg['examenResultado.tabla.interpretacion']}"><h:outputText value="#{r.interpretacion}"/></p:column>
                    </p:dataTable>
                </h:form>
            </h:panelGroup>
            <h:panelGroup id="pnlDetalle" layout="block">
                <h:form id="frmDetalle" rendered="#{examenResultadoModel.estado ne 'NADA'}">
                    <g:botonesTop modelo="#{examenResultadoModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                    <h:panelGrid columns="2" cellpadding="5">
                        <p:outputLabel for="txtId" value="#{msg['examenResultado.form.id']}"/>
                        <p:inputText id="txtId" value="#{examenResultadoModel.registro.idExamenResultado}" size="50" disabled="true"/>
                        <p:outputLabel for="cmbOrden" value="#{msg['examenResultado.form.ordenExamen']}"/>
                        <p:selectOneMenu id="cmbOrden" value="#{examenResultadoModel.idOrdenExamenSeleccionada}" required="true">
                            <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                            <f:selectItems value="#{examenResultadoModel.ordenesExamen}" var="o" itemLabel="#{o.idOrdenExamen} - #{o.fechaCreacion}" itemValue="#{o.idOrdenExamen}"/>
                        </p:selectOneMenu>
                        <p:outputLabel for="txtFecha" value="#{msg['examenResultado.form.fechaCreacion']}"/>
                        <p:inputText id="txtFecha" value="#{examenResultadoModel.registro.fechaCreacion}" size="50" disabled="true"/>
                        <p:outputLabel for="txtResultado" value="#{msg['examenResultado.form.resultado']}"/>
                        <p:inputTextarea id="txtResultado" value="#{examenResultadoModel.registro.resultado}" rows="4" cols="50"/>
                        <p:outputLabel for="txtInterpretacion" value="#{msg['examenResultado.form.interpretacion']}"/>
                        <p:inputTextarea id="txtInterpretacion" value="#{examenResultadoModel.registro.interpretacion}" rows="4" cols="50"/>
                        <p:outputLabel for="txtRuta" value="#{msg['examenResultado.form.rutaAtestado']}"/>
                        <p:inputText id="txtRuta" value="#{examenResultadoModel.registro.rutaAtestado}" size="50"/>
                    </h:panelGrid>
                    <h:panelGrid columns="#{examenResultadoModel.estado eq 'CREAR' ? 1 : 2}">
                        <p:commandButton id="btnGuardar" value="#{msg['boton.guardar']}" actionListener="#{examenResultadoModel.btnGuardarHandler}" rendered="#{examenResultadoModel.estado eq 'CREAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:commandButton id="btnModificar" value="#{msg['boton.modificar']}" actionListener="#{examenResultadoModel.btnModificarHandler}" rendered="#{examenResultadoModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:commandButton id="btnEliminar" value="#{msg['boton.eliminar']}" actionListener="#{examenResultadoModel.btnEliminarHandler}" rendered="#{examenResultadoModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>
        </h:panelGrid>
    </ui:define>
</ui:composition>
