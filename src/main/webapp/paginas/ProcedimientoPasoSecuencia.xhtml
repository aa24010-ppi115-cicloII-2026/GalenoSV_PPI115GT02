<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['procedimientoPasoSecuencia.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['procedimientoPasoSecuencia.titulo']}</ui:define>
    <ui:define name="contenido">
        <h:panelGrid columns="1">
            <h:panelGroup id="pnlTabla" layout="block" rendered="#{procedimientoPasoSecuenciaModel.estado eq 'NADA'}">
                <h:form id="frmTabla">
                    <g:botonesTop modelo="#{procedimientoPasoSecuenciaModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                    <p:dataTable id="tabla" value="#{procedimientoPasoSecuenciaModel.modelo}" var="r" lazy="true"
                                 paginator="true" rows="#{procedimientoPasoSecuenciaModel.cantidadRegistros}" paginatorPosition="both"
                                 emptyMessage="#{msg['tabla.sinRegistros']}" selectionMode="single"
                                 selection="#{procedimientoPasoSecuenciaModel.registro}" rowKey="#{r.idProcedimientoPasoSecuencia}">
                        <p:ajax event="rowSelect" listener="#{procedimientoPasoSecuenciaModel.selectionHandler}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:column headerText="#{msg['tabla.id']}"><h:outputText value="#{r.idProcedimientoPasoSecuencia}"/></p:column>
                        <p:column headerText="#{msg['procedimientoPasoSecuencia.tabla.paso']}"><h:outputText value="#{r.idProcedimientoPaso.nombre}"/></p:column>
                        <p:column headerText="#{msg['procedimientoPasoSecuencia.tabla.referencia']}"><h:outputText value="#{procedimientoPasoSecuenciaModel.nombrePasoReferencia(r.idProcedimientoPasoReferencia)}"/></p:column>
                        <p:column headerText="#{msg['procedimientoPasoSecuencia.tabla.tipoSecuencia']}"><h:outputText value="#{r.tipoSecuencia}"/></p:column>
                    </p:dataTable>
                </h:form>
            </h:panelGroup>
            <h:panelGroup id="pnlDetalle" layout="block">
                <h:form id="frmDetalle" rendered="#{procedimientoPasoSecuenciaModel.estado ne 'NADA'}">
                    <g:botonesTop modelo="#{procedimientoPasoSecuenciaModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                    <h:panelGrid columns="2" cellpadding="5">
                        <p:outputLabel for="txtId" value="#{msg['procedimientoPasoSecuencia.form.id']}"/>
                        <p:inputText id="txtId" value="#{procedimientoPasoSecuenciaModel.registro.idProcedimientoPasoSecuencia}" size="50" disabled="true"/>
                        <p:outputLabel for="cmbPaso" value="#{msg['procedimientoPasoSecuencia.form.paso']}"/>
                        <p:selectOneMenu id="cmbPaso" value="#{procedimientoPasoSecuenciaModel.idProcedimientoPasoSeleccionado}" required="true">
                            <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                            <f:selectItems value="#{procedimientoPasoSecuenciaModel.pasos}" var="p" itemLabel="#{p.nombre}" itemValue="#{p.idProcedimientoPaso}"/>
                        </p:selectOneMenu>
                        <p:outputLabel for="cmbReferencia" value="#{msg['procedimientoPasoSecuencia.form.referencia']}"/>
                        <p:selectOneMenu id="cmbReferencia" value="#{procedimientoPasoSecuenciaModel.idProcedimientoPasoReferenciaTexto}">
                            <f:selectItem itemLabel="#{msg['procedimientoPasoSecuencia.form.sinReferencia']}" itemValue=""/>
                            <f:selectItems value="#{procedimientoPasoSecuenciaModel.pasos}" var="p" itemLabel="#{p.nombre}" itemValue="#{p.idProcedimientoPaso}"/>
                        </p:selectOneMenu>
                        <p:outputLabel for="txtTipo" value="#{msg['procedimientoPasoSecuencia.form.tipoSecuencia']}"/>
                        <p:inputText id="txtTipo" value="#{procedimientoPasoSecuenciaModel.registro.tipoSecuencia}" size="30" maxlength="20"/>
                    </h:panelGrid>
                    <h:panelGrid columns="#{procedimientoPasoSecuenciaModel.estado eq 'CREAR' ? 1 : 2}">
                        <p:commandButton id="btnGuardar" value="#{msg['boton.guardar']}" actionListener="#{procedimientoPasoSecuenciaModel.btnGuardarHandler}" rendered="#{procedimientoPasoSecuenciaModel.estado eq 'CREAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:commandButton id="btnModificar" value="#{msg['boton.modificar']}" actionListener="#{procedimientoPasoSecuenciaModel.btnModificarHandler}" rendered="#{procedimientoPasoSecuenciaModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:commandButton id="btnEliminar" value="#{msg['boton.eliminar']}" actionListener="#{procedimientoPasoSecuenciaModel.btnEliminarHandler}" rendered="#{procedimientoPasoSecuenciaModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>
        </h:panelGrid>
    </ui:define>
</ui:composition>
