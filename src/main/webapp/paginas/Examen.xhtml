<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['examen.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['examen.titulo']}</ui:define>
    <ui:define name="contenido">
        <h:panelGrid columns="1">
            <h:panelGroup id="pnlTabla" layout="block" rendered="#{examenModel.estado eq 'NADA'}">
                <h:form id="frmTabla">
                    <h:panelGrid columns="1">
                        <g:botonesTop modelo="#{examenModel}"
                                      actualizar=":pnlTabla :pnlDetalle :mensajes"/>

                        <p:dataTable id="tabla"
                                     value="#{examenModel.modelo}"
                                     var="r"
                                     lazy="true"
                                     paginator="true"
                                     rows="#{examenModel.cantidadRegistros}"
                                     paginatorPosition="both"
                                     emptyMessage="#{msg['tabla.sinRegistros']}"
                                     selectionMode="single"
                                     selection="#{examenModel.registro}"
                                     rowKey="#{r.idExamen}">
                            <p:ajax event="rowSelect"
                                    listener="#{examenModel.selectionHandler}"
                                    update=":pnlTabla :pnlDetalle :mensajes"/>

                            <p:column headerText="#{msg['tabla.id']}">
                                <h:outputText value="#{r.idExamen}"/>
                            </p:column>
                            <p:column headerText="#{msg['tabla.nombre']}">
                                <h:outputText value="#{r.nombre}"/>
                            </p:column>
                            <p:column headerText="#{msg['tabla.activo']}">
                                <h:outputText value="#{r.activo ? msg['tabla.activo'] : msg['tabla.inactivo']}"/>
                            </p:column>
                            <p:column headerText="#{msg['tabla.observaciones']}">
                                <h:outputText value="#{r.observaciones}"/>
                            </p:column>
                        </p:dataTable>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>

            <h:panelGroup id="pnlDetalle" layout="block">
                <p:tabView id="tabExamen"
                           rendered="#{examenModel.estado ne 'NADA'}"
                           dynamic="true"
                           cache="false">
                    <p:tab title="#{msg['examen.tab.detalle']}" closable="false">
                        <h:form id="frmDetalle">
                            <h:panelGrid columns="1">
                                <g:botonesTop modelo="#{examenModel}"
                                              actualizar=":pnlTabla :pnlDetalle :mensajes"/>

                                <h:panelGrid columns="2" cellpadding="5">
                                    <p:outputLabel for="txtId" value="#{msg['examen.form.id']}"/>
                                    <p:inputText id="txtId"
                                                 value="#{examenModel.registro.idExamen}"
                                                 size="50"
                                                 disabled="true"/>

                                    <p:outputLabel for="txtNombre" value="#{msg['examen.form.nombre']}"/>
                                    <p:inputText id="txtNombre"
                                                 value="#{examenModel.registro.nombre}"
                                                 required="true"
                                                 requiredMessage="#{msg['examen.nombre.requerido']}"
                                                 size="50"
                                                 maxlength="255"/>

                                    <p:outputLabel for="swActivo" value="#{msg['examen.form.activo']}"/>
                                    <p:toggleSwitch id="swActivo"
                                                    value="#{examenModel.registro.activo}"/>

                                    <p:outputLabel for="txtObservaciones" value="#{msg['examen.form.observaciones']}"/>
                                    <p:inputTextarea id="txtObservaciones"
                                                     value="#{examenModel.registro.observaciones}"
                                                     rows="3"
                                                     cols="50"/>
                                </h:panelGrid>

                                <h:panelGrid columns="#{examenModel.estado eq 'CREAR' ? 1 : 2}">
                                    <p:commandButton id="btnGuardar"
                                                     value="#{msg['boton.guardar']}"
                                                     actionListener="#{examenModel.btnGuardarHandler}"
                                                     rendered="#{examenModel.estado eq 'CREAR'}"
                                                     update=":pnlTabla :pnlDetalle :mensajes"/>
                                    <p:commandButton id="btnModificar"
                                                     value="#{msg['boton.modificar']}"
                                                     actionListener="#{examenModel.btnModificarHandler}"
                                                     rendered="#{examenModel.estado eq 'MODIFICAR'}"
                                                     update=":pnlTabla :pnlDetalle :mensajes"/>
                                    <p:commandButton id="btnEliminar"
                                                     value="#{msg['boton.eliminar']}"
                                                     actionListener="#{examenModel.btnEliminarHandler}"
                                                     rendered="#{examenModel.estado eq 'MODIFICAR'}"
                                                     update=":pnlTabla :pnlDetalle :mensajes"/>
                                </h:panelGrid>
                            </h:panelGrid>
                        </h:form>
                    </p:tab>

                    <p:tab title="#{msg['examen.tab.tipos']}"
                           closable="false"
                           disabled="#{examenModel.estado ne 'MODIFICAR'}">
                        <h:panelGrid columns="1">
                            <h:panelGroup id="pnlTablaTipoExamen" layout="block"
                                          rendered="#{examenModel.examenTipoExamenModel.estado eq 'NADA'}">
                                <h:form id="frmTablaTipoExamen">
                                    <h:panelGrid columns="1">
                                        <p:commandButton id="btnNuevoTipoExamen"
                                                         value="#{msg['boton.nuevo']}"
                                                         actionListener="#{examenModel.examenTipoExamenModel.btnNuevoHandler}"
                                                         update=":pnlDetalle :mensajes"/>

                                        <p:dataTable id="tablaTipoExamen"
                                                     value="#{examenModel.examenTipoExamenModel.modelo}"
                                                     var="rt"
                                                     lazy="true"
                                                     paginator="true"
                                                     rows="#{examenModel.examenTipoExamenModel.cantidadRegistros}"
                                                     paginatorPosition="both"
                                                     emptyMessage="#{msg['tabla.sinRegistros']}"
                                                     selectionMode="single"
                                                     selection="#{examenModel.examenTipoExamenModel.registro}"
                                                     rowKey="#{rt.idExamenTipoExamen}">
                                            <p:ajax event="rowSelect"
                                                    listener="#{examenModel.examenTipoExamenModel.selectionHandler}"
                                                    update=":pnlDetalle :mensajes"/>

                                            <p:column headerText="#{msg['tabla.id']}">
                                                <h:outputText value="#{rt.idExamenTipoExamen}"/>
                                            </p:column>
                                            <p:column headerText="#{msg['examenTipoExamen.tabla.tipoExamen']}">
                                                <h:outputText value="#{rt.idTipoExamen.nombre}"/>
                                            </p:column>
                                            <p:column headerText="#{msg['examenTipoExamen.tabla.fechaCreacion']}">
                                                <h:outputText value="#{rt.fechaCreacion}"/>
                                            </p:column>
                                            <p:column headerText="#{msg['tabla.observaciones']}">
                                                <h:outputText value="#{rt.observaciones}"/>
                                            </p:column>
                                        </p:dataTable>
                                    </h:panelGrid>
                                </h:form>
                            </h:panelGroup>

                            <h:panelGroup id="pnlDetalleTipoExamen" layout="block">
                                <h:form id="frmDetalleTipoExamen"
                                        rendered="#{examenModel.examenTipoExamenModel.estado ne 'NADA'}">
                                    <h:panelGrid columns="1">
                                        <h:panelGrid columns="2" cellpadding="5">
                                            <p:outputLabel for="txtIdExamenTipoExamen" value="#{msg['examenTipoExamen.form.id']}"/>
                                            <p:inputText id="txtIdExamenTipoExamen"
                                                         value="#{examenModel.examenTipoExamenModel.registro.idExamenTipoExamen}"
                                                         size="50"
                                                         disabled="true"/>

                                            <p:outputLabel for="txtTipoExamenSeleccionado" value="#{msg['examenTipoExamen.form.tipoExamen']}"/>
                                            <h:panelGroup>
                                                <p:inputText id="txtTipoExamenSeleccionado"
                                                             value="#{examenModel.examenTipoExamenModel.nombreTipoExamenSeleccionado}"
                                                             size="50"
                                                             disabled="true"/>
                                                <p:commandButton id="btnSeleccionarTipo"
                                                                 value="#{msg['examenTipoExamen.boton.seleccionarTipo']}"
                                                                 type="button"
                                                                 onclick="PF('dlgTipoExamen').show();"/>
                                            </h:panelGroup>

                                            <p:outputLabel for="txtObservacionesTipo" value="#{msg['examenTipoExamen.form.observaciones']}"/>
                                            <p:inputTextarea id="txtObservacionesTipo"
                                                             value="#{examenModel.examenTipoExamenModel.registro.observaciones}"
                                                             rows="3"
                                                             cols="50"/>
                                        </h:panelGrid>

                                        <h:panelGrid columns="#{examenModel.examenTipoExamenModel.estado eq 'CREAR' ? 2 : 3}">
                                            <p:commandButton id="btnGuardarTipoExamen"
                                                             value="#{msg['boton.guardar']}"
                                                             actionListener="#{examenModel.examenTipoExamenModel.btnGuardarHandler}"
                                                             rendered="#{examenModel.examenTipoExamenModel.estado eq 'CREAR'}"
                                                             update=":pnlDetalle :mensajes"/>
                                            <p:commandButton id="btnModificarTipoExamen"
                                                             value="#{msg['boton.modificar']}"
                                                             actionListener="#{examenModel.examenTipoExamenModel.btnModificarHandler}"
                                                             rendered="#{examenModel.examenTipoExamenModel.estado eq 'MODIFICAR'}"
                                                             update=":pnlDetalle :mensajes"/>
                                            <p:commandButton id="btnEliminarTipoExamen"
                                                             value="#{msg['boton.eliminar']}"
                                                             actionListener="#{examenModel.examenTipoExamenModel.btnEliminarHandler}"
                                                             rendered="#{examenModel.examenTipoExamenModel.estado eq 'MODIFICAR'}"
                                                             update=":pnlDetalle :mensajes"/>
                                            <p:commandButton id="btnCancelarTipoExamen"
                                                             value="#{msg['boton.cancelar']}"
                                                             actionListener="#{examenModel.examenTipoExamenModel.btnCancelarHandler}"
                                                             update=":pnlDetalle :mensajes"/>
                                        </h:panelGrid>
                                    </h:panelGrid>
                                </h:form>
                            </h:panelGroup>
                        </h:panelGrid>
                    </p:tab>
                </p:tabView>
            </h:panelGroup>
        </h:panelGrid>

        <p:dialog id="dlgTipoExamen"
                  widgetVar="dlgTipoExamen"
                  header="#{msg['examenTipoExamen.dialog.titulo']}"
                  modal="true"
                  closable="true"
                  dynamic="true"
                  cache="false"
                  showEffect="puff">
            <h:form id="frmBuscaTipoExamen">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel for="acTipoExamen" value="#{msg['examenTipoExamen.dialog.buscar']}"/>
                    <p:autoComplete id="acTipoExamen"
                                    value="#{examenModel.examenTipoExamenModel.tipoExamenSeleccionado}"
                                    completeMethod="#{examenModel.examenTipoExamenModel.buscarTipoPorNombre}"
                                    var="te"
                                    itemLabel="#{te.nombre}"
                                    itemValue="#{te}"
                                    converter="tipoExamenConverter"
                                    forceSelection="true"
                                    dropdown="true"
                                    minQueryLength="3"
                                    scrollHeight="250"/>
                </h:panelGrid>
                <p:commandButton id="btnAceptarTipoExamen"
                                 value="#{msg['examenTipoExamen.boton.aceptar']}"
                                 process="@form"
                                 update=":pnlDetalle :mensajes"
                                 oncomplete="PF('dlgTipoExamen').hide();"/>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
