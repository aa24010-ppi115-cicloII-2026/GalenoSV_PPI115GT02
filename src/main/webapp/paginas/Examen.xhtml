<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['examen.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['examen.titulo']}</ui:define>
    
    <ui:define name="contenido">
        <h:form id="frmExamen">
            <p:messages id="mensajes" showDetail="true" closable="true"/>

            <!-- ===== TABLA PRINCIPAL (estado NADA) ===== -->
            <h:panelGroup id="pnlTabla" layout="block" rendered="#{examenModel.estado eq 'NADA'}">
                <h:panelGrid columns="1" style="width:100%">
                    <g:botonesTop modelo="#{examenModel}" actualizar=":frmExamen"/>
                    <p:dataTable id="tabla" value="#{examenModel.modelo}" var="r" lazy="true"
                                 paginator="true" rows="#{examenModel.cantidadRegistros}" paginatorPosition="bottom"
                                 emptyMessage="#{msg['tabla.sinRegistros']}" selectionMode="single"
                                 selection="#{examenModel.registro}" rowKey="#{r.idExamen}">
                        <p:ajax event="rowSelect" listener="#{examenModel.selectionHandler}" resetValues="true" update=":frmExamen"/>
                        <p:column headerText="#{msg['tabla.nombre']}">
                            <h:outputText value="#{r.nombre}"/>
                        </p:column>
                        <p:column headerText="#{msg['tabla.activo']}">
                            <h:outputText value="#{r.activo ? msg['tabla.si'] : msg['tabla.no']}"/>
                        </p:column>
                        <p:column headerText="#{msg['tabla.observaciones']}">
                            <h:outputText value="#{r.observaciones}"/>
                        </p:column>
                    </p:dataTable>
                </h:panelGrid>
            </h:panelGroup>

            <!-- ===== PANEL DE DETALLE (CREAR / MODIFICAR) ===== -->
            <h:panelGroup id="pnlDetalle" layout="block" rendered="#{examenModel.estado ne 'NADA'}">
                <g:botonesTop modelo="#{examenModel}" actualizar=":frmExamen"/>

                <p:tabView id="tabExamen" dynamic="true" cache="false">
                    <!-- ─── Pestaña 1: Detalle del Examen ─── -->
                    <p:tab title="#{msg['examen.tab.detalle']}" closable="false">
                        <p:panel header="#{msg['examen.panel.datos']}">
                            <h:panelGrid columns="2" cellpadding="5">
                                <p:outputLabel for="txtId" value="#{msg['examen.form.id']}"/>
                                <p:inputText id="txtId" value="#{examenModel.registro.idExamen}" size="50" disabled="true"/>

                                <p:outputLabel for="txtNombre" value="#{msg['examen.form.nombre']}"/>
                                <p:inputText id="txtNombre" value="#{examenModel.registro.nombre}" required="true"
                                             requiredMessage="#{msg['examen.nombre.requerido']}" size="50" maxlength="255"/>

                                <p:outputLabel for="swActivo" value="#{msg['examen.form.activo']}"/>
                                <p:toggleSwitch id="swActivo" value="#{examenModel.registro.activo}"/>

                                <p:outputLabel for="txtObservaciones" value="#{msg['examen.form.observaciones']}"/>
                                <p:inputTextarea id="txtObservaciones" value="#{examenModel.registro.observaciones}" rows="3" cols="50" maxlength="1000"/>
                            </h:panelGrid>

                            <h:panelGrid columns="#{examenModel.estado eq 'CREAR' ? 1 : 2}" style="margin-top:10px;">
                                <p:commandButton value="#{msg['boton.guardar']}" actionListener="#{examenModel.btnGuardarHandler}"
                                                 rendered="#{examenModel.estado eq 'CREAR'}" update=":frmExamen"
                                                 styleClass="ui-button-success" process="@this txtId txtNombre swActivo txtObservaciones"/>
                                
                                <p:commandButton value="#{msg['boton.modificar']}" actionListener="#{examenModel.btnModificarHandler}"
                                                 rendered="#{examenModel.estado eq 'MODIFICAR'}" update=":frmExamen"
                                                 styleClass="ui-button-primary" process="@this txtId txtNombre swActivo txtObservaciones"/>
                                
                                <p:commandButton value="#{msg['boton.eliminar']}" actionListener="#{examenModel.btnEliminarHandler}"
                                                 rendered="#{examenModel.estado eq 'MODIFICAR'}" update=":frmExamen"
                                                 styleClass="ui-button-danger" process="@this">
                                    <p:confirm header="#{msg['confirm.titulo']}" message="#{msg['confirm.eliminar']}" icon="pi pi-info-circle"/>
                                </p:commandButton>
                            </h:panelGrid>
                        </p:panel>
                    </p:tab>

                    <!-- ─── Pestaña 2: Tipos de Examen ─── -->
                    <p:tab title="#{msg['examen.tab.tipos']}" closable="false" disabled="#{examenModel.estado ne 'MODIFICAR'}">
                        
                        <h:panelGroup id="panelNuevoTipoExamen" style="margin-bottom:15px; display:block;" rendered="#{examenModel.examenTipoExamenModel.estado ne 'NADA'}">
                            <h:panelGrid columns="2" cellpadding="5" styleClass="ui-fluid">
                                <p:outputLabel for="txtIdExamenTipoExamen" value="#{msg['examenTipoExamen.form.id']}"/>
                                <p:inputText id="txtIdExamenTipoExamen" value="#{examenModel.examenTipoExamenModel.registro.idExamenTipoExamen}" size="50" disabled="true"/>

                                <p:outputLabel for="txtTipoExamenSeleccionado" value="#{msg['examenTipoExamen.form.tipoExamen']}"/>
                                <h:panelGroup>
                                    <p:inputText id="txtTipoExamenSeleccionado" value="#{examenModel.examenTipoExamenModel.nombreTipoExamenSeleccionado}" size="30" disabled="true" style="margin-right:10px;"/>
                                    <p:commandButton icon="pi pi-search" value="#{msg['examenTipoExamen.boton.seleccionarTipo']}"
                                                     type="button" onclick="PF('dlgTipoExamen').show();" styleClass="ui-button-secondary"
                                                     disabled="#{examenModel.examenTipoExamenModel.estado eq 'MODIFICAR'}"/>
                                </h:panelGroup>

                                <p:outputLabel for="txtObservacionesTipo" value="#{msg['examenTipoExamen.form.observaciones']}"/>
                                <p:inputTextarea id="txtObservacionesTipo" value="#{examenModel.examenTipoExamenModel.registro.observaciones}" rows="3" cols="50" maxlength="1000"/>
                            </h:panelGrid>

                            <h:panelGrid columns="#{examenModel.examenTipoExamenModel.estado eq 'CREAR' ? 2 : 3}" style="margin-top:10px;">
                                <p:commandButton value="#{msg['boton.guardar']}" actionListener="#{examenModel.examenTipoExamenModel.btnGuardarHandler}"
                                                 rendered="#{examenModel.examenTipoExamenModel.estado eq 'CREAR'}" 
                                                 update=":frmExamen:tabExamen" process="@this txtIdExamenTipoExamen txtObservacionesTipo" styleClass="ui-button-success"/>
                                
                                <p:commandButton value="#{msg['boton.modificar']}" actionListener="#{examenModel.examenTipoExamenModel.btnModificarHandler}"
                                                 rendered="#{examenModel.examenTipoExamenModel.estado eq 'MODIFICAR'}" 
                                                 update=":frmExamen:tabExamen" process="@this txtIdExamenTipoExamen txtObservacionesTipo" styleClass="ui-button-warning"/>
                                
                                <p:commandButton value="#{msg['boton.eliminar']}" actionListener="#{examenModel.examenTipoExamenModel.btnEliminarHandler}"
                                                 rendered="#{examenModel.examenTipoExamenModel.estado eq 'MODIFICAR'}" 
                                                 update=":frmExamen:tabExamen" process="@this" styleClass="ui-button-danger">
                                     <p:confirm header="#{msg['confirm.titulo']}" message="#{msg['confirm.eliminar']}" icon="pi pi-info-circle"/>
                                </p:commandButton>
                                                 
                                <p:commandButton value="#{msg['boton.cancelar']}" actionListener="#{examenModel.examenTipoExamenModel.btnCancelarHandler}"
                                                 resetValues="true" update=":frmExamen:tabExamen" process="@this" styleClass="ui-button-secondary"/>
                            </h:panelGrid>
                        </h:panelGroup>

                        <h:panelGroup id="panelTablaTipoExamen" rendered="#{examenModel.examenTipoExamenModel.estado eq 'NADA'}">
                            <p:commandButton value="#{msg['boton.nuevo']}" icon="pi pi-plus" styleClass="ui-button-info" style="margin-bottom:10px;"
                                             actionListener="#{examenModel.examenTipoExamenModel.btnNuevoHandler}"
                                             resetValues="true" update=":frmExamen:tabExamen" process="@this"/>
                                             
                            <p:dataTable id="tablaTipoExamen" value="#{examenModel.examenTipoExamenModel.modelo}" var="rt"
                                         lazy="true" paginator="true" rows="#{examenModel.examenTipoExamenModel.cantidadRegistros}"
                                         paginatorPosition="bottom" emptyMessage="#{msg['tabla.sinRegistros']}"
                                         selectionMode="single" selection="#{examenModel.examenTipoExamenModel.registro}"
                                         rowKey="#{rt.idExamenTipoExamen}">
                                         
                                <p:ajax event="rowSelect" listener="#{examenModel.examenTipoExamenModel.selectionHandler}" resetValues="true" update=":frmExamen:tabExamen"/>

                                <p:column headerText="#{msg['examenTipoExamen.tabla.tipoExamen']}">
                                    <h:outputText value="#{rt.idTipoExamen.nombre}"/>
                                </p:column>
                                <p:column headerText="#{msg['examenTipoExamen.tabla.fechaCreacion']}">
                                    <h:outputText value="#{rt.fechaCreacion}"/>
                                </p:column>
                                <p:column headerText="#{msg['tabla.observaciones']}">
                                    <h:outputText value="#{rt.observaciones}"/>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>

                    </p:tab>
                </p:tabView>
            </h:panelGroup>

            <!-- Confirm Dialog global -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="#{msg['confirm.no']}" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="#{msg['confirm.si']}" type="button" styleClass="ui-confirmdialog-yes"/>
            </p:confirmDialog>
        </h:form>

        <!-- DIALOG EXTERNO (FUERA DE frmExamen) -->
        <p:dialog id="dlgTipoExamen" widgetVar="dlgTipoExamen" header="#{msg['examenTipoExamen.dialog.titulo']}"
                  modal="true" closable="true" dynamic="true" cache="false" showEffect="puff">
            <h:form id="frmBuscaTipoExamen">
                <h:panelGrid columns="2" cellpadding="5">
                    <p:outputLabel for="acTipoExamen" value="#{msg['examenTipoExamen.dialog.buscar']}"/>
                    <p:autoComplete id="acTipoExamen" value="#{examenModel.examenTipoExamenModel.tipoExamenSeleccionado}"
                                    completeMethod="#{examenModel.examenTipoExamenModel.buscarTipoPorNombre}"
                                    var="te" itemLabel="#{te.nombre}" itemValue="#{te}"
                                    converter="tipoExamenConverter" forceSelection="true" dropdown="true"
                                    minQueryLength="3" scrollHeight="250"/>
                </h:panelGrid>
                <p:commandButton value="#{msg['examenTipoExamen.boton.aceptar']}"
                                 process="@form" update=":frmExamen:tabExamen:txtTipoExamenSeleccionado"
                                 oncomplete="PF('dlgTipoExamen').hide();"/>
            </h:form>
        </p:dialog>

    </ui:define>
</ui:composition>
