<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['procedimientoPaso.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['procedimientoPaso.titulo']}</ui:define>
    <ui:define name="contenido">
        <h:panelGrid columns="1">
            <h:panelGroup id="pnlTabla" layout="block" rendered="#{procedimientoPasoModel.estado eq 'NADA'}">
                <h:form id="frmTabla">
                    <g:botonesTop modelo="#{procedimientoPasoModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                    <p:dataTable id="tabla" value="#{procedimientoPasoModel.modelo}" var="r" lazy="true"
                                 paginator="true" rows="#{procedimientoPasoModel.cantidadRegistros}" paginatorPosition="both"
                                 emptyMessage="#{msg['tabla.sinRegistros']}" selectionMode="single"
                                 selection="#{procedimientoPasoModel.registro}" rowKey="#{r.idProcedimientoPaso}">
                        <p:ajax event="rowSelect" listener="#{procedimientoPasoModel.selectionHandler}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:column headerText="#{msg['tabla.id']}"><h:outputText value="#{r.idProcedimientoPaso}"/></p:column>
                        <p:column headerText="#{msg['tabla.nombre']}"><h:outputText value="#{r.nombre}"/></p:column>
                        <p:column headerText="#{msg['procedimientoPaso.tabla.procedimiento']}"><h:outputText value="#{r.idProcedimiento.nombre}"/></p:column>
                        <p:column headerText="#{msg['procedimientoPaso.tabla.rol']}"><h:outputText value="#{r.idRol.nombre}"/></p:column>
                        <p:column headerText="#{msg['procedimientoPaso.tabla.indicaFin']}"><h:outputText value="#{r.indicaFin ? 'Si' : 'No'}"/></p:column>
                    </p:dataTable>
                </h:form>
            </h:panelGroup>
            <h:panelGroup id="pnlDetalle" layout="block">
                <h:form id="frmDetalle" rendered="#{procedimientoPasoModel.estado ne 'NADA'}">
                    <g:botonesTop modelo="#{procedimientoPasoModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                    <h:panelGrid columns="2" cellpadding="5">
                        <p:outputLabel for="txtId" value="#{msg['procedimientoPaso.form.id']}"/>
                        <p:inputText id="txtId" value="#{procedimientoPasoModel.registro.idProcedimientoPaso}" size="50" disabled="true"/>
                        <p:outputLabel for="txtNombre" value="#{msg['procedimientoPaso.form.nombre']}"/>
                        <p:inputText id="txtNombre" value="#{procedimientoPasoModel.registro.nombre}" size="50" maxlength="155" required="true"/>
                        <p:outputLabel for="cmbProcedimiento" value="#{msg['procedimientoPaso.form.procedimiento']}"/>
                        <p:selectOneMenu id="cmbProcedimiento" value="#{procedimientoPasoModel.idProcedimientoSeleccionado}" required="true">
                            <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                            <f:selectItems value="#{procedimientoPasoModel.procedimientos}" var="p" itemLabel="#{p.nombre}" itemValue="#{p.idProcedimiento}"/>
                        </p:selectOneMenu>
                        <p:outputLabel for="cmbRol" value="#{msg['procedimientoPaso.form.rol']}"/>
                        <p:selectOneMenu id="cmbRol" value="#{procedimientoPasoModel.idRolSeleccionado}" required="true">
                            <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                            <f:selectItems value="#{procedimientoPasoModel.roles}" var="r" itemLabel="#{r.nombre}" itemValue="#{r.idRol}"/>
                        </p:selectOneMenu>
                        <p:outputLabel for="chkFin" value="#{msg['procedimientoPaso.form.indicaFin']}"/>
                        <p:toggleSwitch id="chkFin" value="#{procedimientoPasoModel.registro.indicaFin}"/>
                    </h:panelGrid>
                    <h:panelGrid columns="#{procedimientoPasoModel.estado eq 'CREAR' ? 1 : 2}">
                        <p:commandButton id="btnGuardar" value="#{msg['boton.guardar']}" actionListener="#{procedimientoPasoModel.btnGuardarHandler}" rendered="#{procedimientoPasoModel.estado eq 'CREAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:commandButton id="btnModificar" value="#{msg['boton.modificar']}" actionListener="#{procedimientoPasoModel.btnModificarHandler}" rendered="#{procedimientoPasoModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:commandButton id="btnEliminar" value="#{msg['boton.eliminar']}" actionListener="#{procedimientoPasoModel.btnEliminarHandler}" rendered="#{procedimientoPasoModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>
        </h:panelGrid>
    </ui:define>
</ui:composition>
