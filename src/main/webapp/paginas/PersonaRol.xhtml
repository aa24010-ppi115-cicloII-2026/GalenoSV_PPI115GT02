<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['personaRol.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['personaRol.titulo']}</ui:define>
    <ui:define name="contenido">
        <h:panelGrid columns="1">
            <h:panelGroup id="pnlTabla" layout="block" rendered="#{personaRolModel.estado eq 'NADA'}">
                <h:form id="frmTabla">
                    <h:panelGrid columns="1">
                        <g:botonesTop modelo="#{personaRolModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:dataTable id="tabla" value="#{personaRolModel.modelo}" var="r" lazy="true"
                                     paginator="true" rows="#{personaRolModel.cantidadRegistros}"
                                     paginatorPosition="both" emptyMessage="#{msg['tabla.sinRegistros']}"
                                     selectionMode="single" selection="#{personaRolModel.registro}" rowKey="#{r.idPersonaRol}">
                            <p:ajax event="rowSelect" listener="#{personaRolModel.selectionHandler}"
                                    update=":pnlTabla :pnlDetalle :mensajes"/>
                            <p:column headerText="#{msg['tabla.id']}"><h:outputText value="#{r.idPersonaRol}"/></p:column>
                            <p:column headerText="#{msg['personaRol.tabla.persona']}"><h:outputText value="#{r.idPersona.nombres} #{r.idPersona.apellidos}"/></p:column>
                            <p:column headerText="#{msg['personaRol.tabla.rol']}"><h:outputText value="#{r.idRol.nombre}"/></p:column>
                            <p:column headerText="#{msg['personaRol.tabla.clinica']}"><h:outputText value="#{r.idClinica.nombre}"/></p:column>
                            <p:column headerText="#{msg['personaRol.tabla.fechaCreacion']}"><h:outputText value="#{r.fechaCreacion}"/></p:column>
                        </p:dataTable>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>
            <h:panelGroup id="pnlDetalle" layout="block">
                <h:form id="frmDetalle" rendered="#{personaRolModel.estado ne 'NADA'}">
                    <h:panelGrid columns="1">
                        <g:botonesTop modelo="#{personaRolModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                        <h:panelGrid columns="2" cellpadding="5">
                            <p:outputLabel for="txtId" value="#{msg['personaRol.form.id']}"/>
                            <p:inputText id="txtId" value="#{personaRolModel.registro.idPersonaRol}" size="50" disabled="true"/>
                            <p:outputLabel for="cmbPersona" value="#{msg['personaRol.form.persona']}"/>
                            <p:selectOneMenu id="cmbPersona" value="#{personaRolModel.idPersonaSeleccionada}" required="true">
                                <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                                <f:selectItems value="#{personaRolModel.personas}" var="p" itemLabel="#{p.nombres} #{p.apellidos}" itemValue="#{p.idPersona}"/>
                            </p:selectOneMenu>
                            <p:outputLabel for="cmbRol" value="#{msg['personaRol.form.rol']}"/>
                            <p:selectOneMenu id="cmbRol" value="#{personaRolModel.idRolSeleccionado}" required="true">
                                <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                                <f:selectItems value="#{personaRolModel.roles}" var="r" itemLabel="#{r.nombre}" itemValue="#{r.idRol}"/>
                            </p:selectOneMenu>
                            <p:outputLabel for="cmbClinica" value="#{msg['personaRol.form.clinica']}"/>
                            <p:selectOneMenu id="cmbClinica" value="#{personaRolModel.idClinicaSeleccionada}" required="true">
                                <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                                <f:selectItems value="#{personaRolModel.clinicas}" var="c" itemLabel="#{c.nombre}" itemValue="#{c.idClinica}"/>
                            </p:selectOneMenu>
                            <p:outputLabel for="txtFechaCreacion" value="#{msg['personaRol.form.fechaCreacion']}"/>
                            <p:inputText id="txtFechaCreacion" value="#{personaRolModel.registro.fechaCreacion}" size="50" disabled="true"/>
                        </h:panelGrid>
                        <h:panelGrid columns="#{personaRolModel.estado eq 'CREAR' ? 1 : 2}">
                            <p:commandButton id="btnGuardar" value="#{msg['boton.guardar']}" actionListener="#{personaRolModel.btnGuardarHandler}" rendered="#{personaRolModel.estado eq 'CREAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                            <p:commandButton id="btnModificar" value="#{msg['boton.modificar']}" actionListener="#{personaRolModel.btnModificarHandler}" rendered="#{personaRolModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                            <p:commandButton id="btnEliminar" value="#{msg['boton.eliminar']}" actionListener="#{personaRolModel.btnEliminarHandler}" rendered="#{personaRolModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        </h:panelGrid>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>
        </h:panelGrid>
    </ui:define>
</ui:composition>
