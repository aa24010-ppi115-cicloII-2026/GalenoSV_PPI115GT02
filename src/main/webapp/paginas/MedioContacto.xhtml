<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['medioContacto.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['medioContacto.titulo']}</ui:define>
    <ui:define name="contenido">
        <p:toolbar style="margin-bottom:12px">
            <f:facet name="left">
                <p:link value="← #{msg['detalle.volver']}: #{msg['persona.titulo']}" outcome="/paginas/Persona"/>
            </f:facet>
        </p:toolbar>
        <h:panelGrid columns="1">
            <h:panelGroup id="pnlTabla" layout="block" rendered="#{medioContactoModel.estado eq 'NADA'}">
                <h:form id="frmTabla">
                    <g:botonesTop modelo="#{medioContactoModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                    <p:dataTable id="tabla" value="#{medioContactoModel.modelo}" var="r" lazy="true"
                                 paginator="true" rows="#{medioContactoModel.cantidadRegistros}" paginatorPosition="bottom"
                                 emptyMessage="#{msg['tabla.sinRegistros']}" selectionMode="single"
                                 selection="#{medioContactoModel.registro}" rowKey="#{r.idMedioContacto}">
                        <p:ajax event="rowSelect" listener="#{medioContactoModel.selectionHandler}" update=":pnlTabla :pnlDetalle :mensajes :avisos"/>
                        <p:column headerText="#{msg['medioContacto.tabla.persona']}"><h:outputText value="#{r.idPersona.nombres} #{r.idPersona.apellidos}"/></p:column>
                        <p:column headerText="#{msg['medioContacto.tabla.tipoMedioContacto']}"><h:outputText value="#{r.idTipoMedioContacto.nombre}"/></p:column>
                        <p:column headerText="#{msg['medioContacto.tabla.valor']}"><h:outputText value="#{r.valor}"/></p:column>
                        <p:column headerText="#{msg['medioContacto.tabla.fechaCreacion']}"><h:outputText value="#{r.fechaCreacion}"/></p:column>
                    </p:dataTable>
                </h:form>
            </h:panelGroup>
            <h:panelGroup id="pnlDetalle" layout="block">
                <h:form id="frmDetalle" rendered="#{medioContactoModel.estado ne 'NADA'}">
                    <g:botonesTop modelo="#{medioContactoModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                    <h:panelGrid columns="2" cellpadding="5">
                        <p:outputLabel for="txtId" value="#{msg['medioContacto.form.id']}"/>
                        <p:inputText id="txtId" value="#{medioContactoModel.registro.idMedioContacto}" size="50" disabled="true"/>
                        <p:outputLabel for="cmbPersona" value="#{msg['medioContacto.form.persona']}"/>
                        <p:selectOneMenu id="cmbPersona" value="#{medioContactoModel.idPersonaSeleccionada}" required="true" requiredMessage="#{msg['validacion.seleccione']}"
                                         disabled="#{medioContactoModel.estado eq 'MODIFICAR'}">
                            <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                            <f:selectItems value="#{medioContactoModel.personas}" var="p" itemLabel="#{p.nombres} #{p.apellidos}" itemValue="#{p.idPersona}"/>
                        </p:selectOneMenu>
                        <p:outputLabel for="cmbTipo" value="#{msg['medioContacto.form.tipoMedioContacto']}"/>
                        <p:selectOneMenu id="cmbTipo" value="#{medioContactoModel.idTipoMedioContactoSeleccionado}" required="true" requiredMessage="#{msg['validacion.seleccione']}"
                                         disabled="#{medioContactoModel.estado eq 'MODIFICAR'}">
                            <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                            <f:selectItems value="#{medioContactoModel.tiposMedioContacto}" var="t" itemLabel="#{t.nombre}" itemValue="#{t.idTipoMedioContacto}"/>
                        </p:selectOneMenu>
                        <p:outputLabel for="txtValor" value="#{msg['medioContacto.form.valor']}"/>
                        <p:inputText id="txtValor" value="#{medioContactoModel.registro.valor}" size="50" maxlength="50"
                                     required="true" requiredMessage="#{msg['medioContacto.valor.requerido']}"
                                     placeholder="#{msg['medioContacto.ejemplo.valor']}" title="#{msg['validacion.minimo8']}"/>
                        <p:outputLabel for="txtFecha" value="#{msg['medioContacto.form.fechaCreacion']}"/>
                        <p:inputText id="txtFecha" value="#{medioContactoModel.registro.fechaCreacion}" size="50" disabled="true"/>
                    </h:panelGrid>
                    <h:panelGrid columns="#{medioContactoModel.estado eq 'CREAR' ? 1 : 2}">
                        <p:commandButton id="btnGuardar" value="#{msg['boton.guardar']}" icon="pi pi-check" styleClass="ui-button-success" actionListener="#{medioContactoModel.btnGuardarHandler}" rendered="#{medioContactoModel.estado eq 'CREAR'}" update=":pnlTabla :pnlDetalle :mensajes :avisos"/>
                        <p:commandButton id="btnModificar" value="#{msg['boton.modificar']}" icon="pi pi-pencil" styleClass="ui-button-warning" actionListener="#{medioContactoModel.btnModificarHandler}" rendered="#{medioContactoModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes :avisos"/>
                        <p:commandButton id="btnEliminar" value="#{msg['boton.eliminar']}" icon="pi pi-trash" styleClass="ui-button-danger" actionListener="#{medioContactoModel.btnEliminarHandler}" rendered="#{medioContactoModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes :avisos"/>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>
        </h:panelGrid>
    </ui:define>
</ui:composition>
