<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['consultaProcedimientoPaso.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['consultaProcedimientoPaso.titulo']}</ui:define>
    <ui:define name="contenido">
        <h:panelGrid columns="1">
            <h:panelGroup id="pnlTabla" layout="block" rendered="#{consultaProcedimientoPasoModel.estado eq 'NADA'}">
                <h:form id="frmTabla">
                    <g:botonesTop modelo="#{consultaProcedimientoPasoModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                    <p:dataTable id="tabla" value="#{consultaProcedimientoPasoModel.modelo}" var="r" lazy="true"
                                 paginator="true" rows="#{consultaProcedimientoPasoModel.cantidadRegistros}" paginatorPosition="both"
                                 emptyMessage="#{msg['tabla.sinRegistros']}" selectionMode="single"
                                 selection="#{consultaProcedimientoPasoModel.registro}" rowKey="#{r.idConsultaProcedimientoPaso}">
                        <p:ajax event="rowSelect" listener="#{consultaProcedimientoPasoModel.selectionHandler}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:column headerText="#{msg['tabla.id']}"><h:outputText value="#{r.idConsultaProcedimientoPaso}"/></p:column>
                        <p:column headerText="#{msg['consultaProcedimientoPaso.tabla.consultaProcedimiento']}"><h:outputText value="#{r.idConsultaProcedimiento.idConsultaProcedimiento}"/></p:column>
                        <p:column headerText="#{msg['consultaProcedimientoPaso.tabla.personaRol']}"><h:outputText value="#{r.idPersonaRol.idPersona.nombres} #{r.idPersonaRol.idPersona.apellidos} - #{r.idPersonaRol.idRol.nombre}"/></p:column>
                        <p:column headerText="#{msg['consultaProcedimientoPaso.tabla.estado']}"><h:outputText value="#{r.estado}"/></p:column>
                        <p:column headerText="#{msg['consultaProcedimientoPaso.tabla.fechaInicio']}"><h:outputText value="#{r.fechaInicio}"/></p:column>
                    </p:dataTable>
                </h:form>
            </h:panelGroup>
            <h:panelGroup id="pnlDetalle" layout="block">
                <h:form id="frmDetalle" rendered="#{consultaProcedimientoPasoModel.estado ne 'NADA'}">
                    <g:botonesTop modelo="#{consultaProcedimientoPasoModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                    <h:panelGrid columns="2" cellpadding="5">
                        <p:outputLabel for="txtId" value="#{msg['consultaProcedimientoPaso.form.id']}"/>
                        <p:inputText id="txtId" value="#{consultaProcedimientoPasoModel.registro.idConsultaProcedimientoPaso}" size="50" disabled="true"/>
                        <p:outputLabel for="cmbConsultaProcedimiento" value="#{msg['consultaProcedimientoPaso.form.consultaProcedimiento']}"/>
                        <p:selectOneMenu id="cmbConsultaProcedimiento" value="#{consultaProcedimientoPasoModel.idConsultaProcedimientoSeleccionado}" required="true">
                            <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                            <f:selectItems value="#{consultaProcedimientoPasoModel.consultaProcedimientos}" var="cp" itemLabel="#{cp.idConsulta.idConsulta} - #{cp.fechaInicio}" itemValue="#{cp.idConsultaProcedimiento}"/>
                        </p:selectOneMenu>
                        <p:outputLabel for="cmbPersonaRol" value="#{msg['consultaProcedimientoPaso.form.personaRol']}"/>
                        <p:selectOneMenu id="cmbPersonaRol" value="#{consultaProcedimientoPasoModel.idPersonaRolSeleccionado}" required="true">
                            <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                            <f:selectItems value="#{consultaProcedimientoPasoModel.personasRol}" var="pr" itemLabel="#{pr.idPersona.nombres} #{pr.idPersona.apellidos} - #{pr.idRol.nombre}" itemValue="#{pr.idPersonaRol}"/>
                        </p:selectOneMenu>
                        <p:outputLabel for="txtEstado" value="#{msg['consultaProcedimientoPaso.form.estado']}"/>
                        <p:inputText id="txtEstado" value="#{consultaProcedimientoPasoModel.registro.estado}" size="30" maxlength="20"/>
                        <p:outputLabel for="txtFechaInicio" value="#{msg['consultaProcedimientoPaso.form.fechaInicio']}"/>
                        <p:inputText id="txtFechaInicio" value="#{consultaProcedimientoPasoModel.registro.fechaInicio}" size="50" disabled="true"/>
                    </h:panelGrid>
                    <h:panelGrid columns="#{consultaProcedimientoPasoModel.estado eq 'CREAR' ? 1 : 2}">
                        <p:commandButton id="btnGuardar" value="#{msg['boton.guardar']}" actionListener="#{consultaProcedimientoPasoModel.btnGuardarHandler}" rendered="#{consultaProcedimientoPasoModel.estado eq 'CREAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:commandButton id="btnModificar" value="#{msg['boton.modificar']}" actionListener="#{consultaProcedimientoPasoModel.btnModificarHandler}" rendered="#{consultaProcedimientoPasoModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:commandButton id="btnEliminar" value="#{msg['boton.eliminar']}" actionListener="#{consultaProcedimientoPasoModel.btnEliminarHandler}" rendered="#{consultaProcedimientoPasoModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>
        </h:panelGrid>
    </ui:define>
</ui:composition>
