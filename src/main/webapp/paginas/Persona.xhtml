<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html" xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets" xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['persona.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['persona.titulo']}</ui:define>
    <ui:define name="contenido">
        <h:panelGroup id="pnlTabla" layout="block">
            <h:form id="frmTabla" rendered="#{personaModel.estado eq 'NADA'}">
                <g:botonesTop modelo="#{personaModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                <p:dataTable id="tabla" value="#{personaModel.modelo}" var="r" lazy="true" paginator="true"
                             rows="#{personaModel.cantidadRegistros}" paginatorPosition="both"
                             emptyMessage="#{msg['tabla.sinRegistros']}" selectionMode="single"
                             selection="#{personaModel.registro}" rowKey="#{r.idPersona}">
                    <p:ajax event="rowSelect" listener="#{personaModel.selectionHandler}" update=":pnlTabla :pnlDetalle :mensajes"/>
                    <p:column headerText="#{msg['tabla.id']}"><h:outputText value="#{r.idPersona}"/></p:column>
                    <p:column headerText="#{msg['persona.tabla.nombres']}"><h:outputText value="#{r.nombres}"/></p:column>
                    <p:column headerText="#{msg['persona.tabla.apellidos']}"><h:outputText value="#{r.apellidos}"/></p:column>
                    <p:column headerText="#{msg['persona.tabla.fechaNacimiento']}"><h:outputText value="#{fechaBean.fecha(r.fechaNacimiento)}"/></p:column>
                    <p:column headerText="#{msg['persona.tabla.fechaCreacion']}"><h:outputText value="#{fechaBean.fechaHora(r.fechaCreacion)}"/></p:column>
                </p:dataTable>
            </h:form>
        </h:panelGroup>

        <h:panelGroup id="pnlDetalle" layout="block">
            <p:panel header="#{msg['persona.seccion.maestro']}" rendered="#{personaModel.estado ne 'NADA'}">
                <h:form id="frmPersona">
                    <g:botonesTop modelo="#{personaModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                    <h:panelGrid columns="2" cellpadding="5">
                        <p:outputLabel for="idPersona" value="#{msg['persona.form.id']}"/>
                        <p:inputText id="idPersona" value="#{personaModel.registro.idPersona}" size="50" disabled="true"/>
                        <p:outputLabel for="nombres" value="#{msg['persona.form.nombres']}"/>
                        <p:inputText id="nombres" value="#{personaModel.registro.nombres}" required="true"
                                     requiredMessage="#{msg['persona.nombres.requeridos']}" size="50" maxlength="255"/>
                        <p:outputLabel for="apellidos" value="#{msg['persona.form.apellidos']}"/>
                        <p:inputText id="apellidos" value="#{personaModel.registro.apellidos}" required="true"
                                     requiredMessage="#{msg['persona.apellidos.requeridos']}" size="50" maxlength="255"/>
                        <p:outputLabel for="fechaNacimiento" value="#{msg['persona.form.fechaNacimiento']}"/>
                        <p:datePicker id="fechaNacimiento" value="#{personaModel.fechaNacimientoSeleccionada}"
                                      pattern="dd/MM/yyyy" showIcon="true" monthNavigator="true" yearNavigator="true"/>
                        <p:outputLabel value="#{msg['persona.form.fechaCreacion']}"/>
                        <h:outputText value="#{fechaBean.fechaHora(personaModel.registro.fechaCreacion)}"/>
                    </h:panelGrid>
                    <h:panelGrid columns="#{personaModel.estado eq 'CREAR' ? 1 : 2}">
                        <p:commandButton value="#{msg['boton.guardar']}" actionListener="#{personaModel.btnGuardarHandler}"
                                         rendered="#{personaModel.estado eq 'CREAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:commandButton value="#{msg['boton.modificar']}" actionListener="#{personaModel.btnModificarHandler}"
                                         rendered="#{personaModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:commandButton value="#{msg['boton.eliminar']}" actionListener="#{personaModel.btnEliminarHandler}"
                                         rendered="#{personaModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                    </h:panelGrid>
                </h:form>
            </p:panel>

            <p:tabView id="tabDetalles" rendered="#{personaModel.estado eq 'MODIFICAR'}">
                <p:tab title="#{msg['persona.tab.documentos']}">
                    <h:form id="frmDocumentos">
                        <g:botonesTop modelo="#{personaModel.documentoModel}" actualizar=":pnlDetalle :mensajes"/>
                        <p:dataTable id="documentos" value="#{personaModel.documentoModel.modelo}" var="d" lazy="true"
                                     paginator="true" rows="#{personaModel.documentoModel.cantidadRegistros}"
                                     paginatorPosition="both" emptyMessage="#{msg['tabla.sinRegistros']}"
                                     selectionMode="single" selection="#{personaModel.documentoModel.registro}"
                                     rowKey="#{d.idDocumento}" rendered="#{personaModel.documentoModel.estado eq 'NADA'}">
                            <p:ajax event="rowSelect" listener="#{personaModel.documentoModel.selectionHandler}" update=":pnlDetalle :mensajes"/>
                            <p:column headerText="#{msg['documento.tabla.tipoDocumento']}"><h:outputText value="#{d.idTipoDocumento.nombre}"/></p:column>
                            <p:column headerText="#{msg['documento.tabla.valor']}"><h:outputText value="#{d.valor}"/></p:column>
                            <p:column headerText="#{msg['documento.tabla.rutaFisica']}"><h:outputText value="#{d.rutaFisica}"/></p:column>
                        </p:dataTable>
                        <h:panelGrid columns="2" cellpadding="5" rendered="#{personaModel.documentoModel.estado ne 'NADA'}">
                            <p:outputLabel for="tipoDocumento" value="#{msg['documento.form.tipoDocumento']}"/>
                            <p:selectOneMenu id="tipoDocumento" value="#{personaModel.documentoModel.idTipoDocumentoSeleccionado}" required="true">
                                <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                                <f:selectItems value="#{personaModel.documentoModel.tiposDocumento}" var="t" itemLabel="#{t.nombre}" itemValue="#{t.idTipoDocumento}"/>
                            </p:selectOneMenu>
                            <p:outputLabel for="valorDocumento" value="#{msg['documento.form.valor']}"/>
                            <p:inputText id="valorDocumento" value="#{personaModel.documentoModel.registro.valor}" required="true" maxlength="255"/>
                            <p:outputLabel for="rutaDocumento" value="#{msg['documento.form.rutaFisica']}"/>
                            <p:inputText id="rutaDocumento" value="#{personaModel.documentoModel.registro.rutaFisica}" maxlength="1000"/>
                        </h:panelGrid>
                        <h:panelGrid columns="2" rendered="#{personaModel.documentoModel.estado ne 'NADA'}">
                            <p:commandButton value="#{msg['boton.guardar']}" actionListener="#{personaModel.documentoModel.btnGuardarHandler}" rendered="#{personaModel.documentoModel.estado eq 'CREAR'}" update=":pnlDetalle :mensajes"/>
                            <p:commandButton value="#{msg['boton.modificar']}" actionListener="#{personaModel.documentoModel.btnModificarHandler}" rendered="#{personaModel.documentoModel.estado eq 'MODIFICAR'}" update=":pnlDetalle :mensajes"/>
                            <p:commandButton value="#{msg['boton.eliminar']}" actionListener="#{personaModel.documentoModel.btnEliminarHandler}" rendered="#{personaModel.documentoModel.estado eq 'MODIFICAR'}" update=":pnlDetalle :mensajes"/>
                        </h:panelGrid>
                    </h:form>
                </p:tab>

                <p:tab title="#{msg['persona.tab.mediosContacto']}">
                    <h:form id="frmContactos">
                        <g:botonesTop modelo="#{personaModel.medioContactoModel}" actualizar=":pnlDetalle :mensajes"/>
                        <p:dataTable id="contactos" value="#{personaModel.medioContactoModel.modelo}" var="c" lazy="true"
                                     paginator="true" rows="#{personaModel.medioContactoModel.cantidadRegistros}"
                                     paginatorPosition="both" emptyMessage="#{msg['tabla.sinRegistros']}"
                                     selectionMode="single" selection="#{personaModel.medioContactoModel.registro}"
                                     rowKey="#{c.idMedioContacto}" rendered="#{personaModel.medioContactoModel.estado eq 'NADA'}">
                            <p:ajax event="rowSelect" listener="#{personaModel.medioContactoModel.selectionHandler}" update=":pnlDetalle :mensajes"/>
                            <p:column headerText="#{msg['medioContacto.tabla.tipoMedioContacto']}"><h:outputText value="#{c.idTipoMedioContacto.nombre}"/></p:column>
                            <p:column headerText="#{msg['medioContacto.tabla.valor']}"><h:outputText value="#{c.valor}"/></p:column>
                            <p:column headerText="#{msg['medioContacto.tabla.fechaCreacion']}"><h:outputText value="#{fechaBean.fechaHora(c.fechaCreacion)}"/></p:column>
                        </p:dataTable>
                        <h:panelGrid columns="2" cellpadding="5" rendered="#{personaModel.medioContactoModel.estado ne 'NADA'}">
                            <p:outputLabel for="tipoContacto" value="#{msg['medioContacto.form.tipoMedioContacto']}"/>
                            <p:selectOneMenu id="tipoContacto" value="#{personaModel.medioContactoModel.idTipoMedioContactoSeleccionado}" required="true">
                                <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                                <f:selectItems value="#{personaModel.medioContactoModel.tiposMedioContacto}" var="t" itemLabel="#{t.nombre}" itemValue="#{t.idTipoMedioContacto}"/>
                            </p:selectOneMenu>
                            <p:outputLabel for="valorContacto" value="#{msg['medioContacto.form.valor']}"/>
                            <p:inputText id="valorContacto" value="#{personaModel.medioContactoModel.registro.valor}" required="true" maxlength="255"/>
                            <p:outputLabel value="#{msg['medioContacto.form.fechaCreacion']}"/>
                            <h:outputText value="#{fechaBean.fechaHora(personaModel.medioContactoModel.registro.fechaCreacion)}"/>
                        </h:panelGrid>
                        <h:panelGrid columns="2" rendered="#{personaModel.medioContactoModel.estado ne 'NADA'}">
                            <p:commandButton value="#{msg['boton.guardar']}" actionListener="#{personaModel.medioContactoModel.btnGuardarHandler}" rendered="#{personaModel.medioContactoModel.estado eq 'CREAR'}" update=":pnlDetalle :mensajes"/>
                            <p:commandButton value="#{msg['boton.modificar']}" actionListener="#{personaModel.medioContactoModel.btnModificarHandler}" rendered="#{personaModel.medioContactoModel.estado eq 'MODIFICAR'}" update=":pnlDetalle :mensajes"/>
                            <p:commandButton value="#{msg['boton.eliminar']}" actionListener="#{personaModel.medioContactoModel.btnEliminarHandler}" rendered="#{personaModel.medioContactoModel.estado eq 'MODIFICAR'}" update=":pnlDetalle :mensajes"/>
                        </h:panelGrid>
                    </h:form>
                </p:tab>
            </p:tabView>
        </h:panelGroup>
    </ui:define>
</ui:composition>
