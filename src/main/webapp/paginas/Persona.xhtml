<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['persona.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['persona.titulo']}</ui:define>

    <ui:define name="contenido">
        <h:form id="frmPersona">
            <p:messages id="mensajes" showDetail="true" closable="true"/>

            <!-- ===== TABLA PRINCIPAL ===== -->
            <h:panelGroup id="pnlTabla" layout="block" rendered="#{personaModel.estado eq 'NADA'}">
                <h:panelGrid columns="1" style="width:100%">
                    <g:botonesTop modelo="#{personaModel}" actualizar=":frmPersona"/>
                    <p:dataTable id="tabla" value="#{personaModel.modelo}" var="r" lazy="true"
                                 paginator="true" rows="#{personaModel.cantidadRegistros}"
                                 paginatorPosition="bottom" emptyMessage="#{msg['tabla.sinRegistros']}"
                                 selectionMode="single" selection="#{personaModel.registro}"
                                 rowKey="#{r.idPersona}">
                        <p:ajax event="rowSelect" listener="#{personaModel.selectionHandler}" update=":frmPersona"/>
                        <p:column headerText="#{msg['persona.tabla.nombres']}"><h:outputText value="#{r.nombres}"/></p:column>
                        <p:column headerText="#{msg['persona.tabla.apellidos']}"><h:outputText value="#{r.apellidos}"/></p:column>
                    </p:dataTable>
                </h:panelGrid>
            </h:panelGroup>

            <!-- ===== PANEL DE DETALLES (Maestro) ===== -->
            <h:panelGroup id="pnlDetalle" layout="block" rendered="#{personaModel.estado ne 'NADA'}">
                <g:botonesTop modelo="#{personaModel}" actualizar=":frmPersona"/>
                <p:panel header="#{msg['persona.panel.datos']}">
                    <h:panelGrid columns="2" cellpadding="5">
                        <p:outputLabel for="txtId" value="#{msg['tabla.id']}"/>
                        <p:inputText id="txtId" value="#{personaModel.registro.idPersona}" size="50" disabled="true"/>

                        <p:outputLabel for="txtNombres" value="#{msg['persona.form.nombres']} *"/>
                        <p:inputText id="txtNombres" value="#{personaModel.registro.nombres}" size="50" maxlength="255"
                                     required="true" requiredMessage="#{msg['persona.nombres.requeridos']}"/>

                        <p:outputLabel for="txtApellidos" value="#{msg['persona.form.apellidos']} *"/>
                        <p:inputText id="txtApellidos" value="#{personaModel.registro.apellidos}" size="50" maxlength="255"
                                     required="true" requiredMessage="#{msg['persona.apellidos.requeridos']}"/>
                    </h:panelGrid>

                    <h:panelGrid columns="#{personaModel.estado eq 'CREAR' ? 1 : 2}" style="margin-top:10px;">
                        <p:commandButton value="#{msg['boton.guardar']}" actionListener="#{personaModel.btnGuardarHandler}"
                                         rendered="#{personaModel.estado eq 'CREAR'}" update=":frmPersona"
                                         styleClass="ui-button-success" process="@this txtId txtNombres txtApellidos"/>
                        <p:commandButton value="#{msg['boton.modificar']}" actionListener="#{personaModel.btnModificarHandler}"
                                         rendered="#{personaModel.estado eq 'MODIFICAR'}" update=":frmPersona"
                                         styleClass="ui-button-primary" process="@this txtId txtNombres txtApellidos"/>
                        <p:commandButton value="#{msg['boton.eliminar']}" actionListener="#{personaModel.btnEliminarHandler}"
                                         rendered="#{personaModel.estado eq 'MODIFICAR'}" update=":frmPersona"
                                         styleClass="ui-button-danger" process="@this">
                            <p:confirm header="#{msg['confirm.titulo']}" message="#{msg['confirm.eliminar']}" icon="pi pi-info-circle"/>
                        </p:commandButton>
                    </h:panelGrid>
                </p:panel>

                <!-- ===== PESTAÑAS (Solo en modo modificar) ===== -->
                <p:tabView rendered="#{personaModel.estado eq 'MODIFICAR'}" style="margin-top:20px;">

                    <!-- ─── Pestaña 1: Roles ─── -->
                    <p:tab title="#{msg['persona.tab.roles']}">
                        <h:panelGroup id="panelNuevoRol" style="margin-bottom:15px; display:block;">
                            <h:panelGrid columns="4" cellpadding="5" styleClass="ui-fluid">
                                <p:outputLabel value="#{msg['persona.seleccione.rol']}:"/>
                                <p:selectOneMenu value="#{personaModel.idRolSeleccionado}" style="width:200px" required="true" requiredMessage="#{msg['persona.seleccione.rol']}">
                                    <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                                    <f:selectItems value="#{personaModel.rolesDisponibles}" var="rol"
                                                   itemLabel="#{rol.nombre}" itemValue="#{rol.idRol}"/>
                                </p:selectOneMenu>

                                <p:outputLabel value="#{msg['persona.seleccione.clinica']}:"/>
                                <p:selectOneMenu value="#{personaModel.idClinicaSeleccionadaRol}" style="width:200px" required="true" requiredMessage="#{msg['persona.seleccione.clinica']}">
                                    <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                                    <f:selectItems value="#{personaModel.clinicas}" var="cli"
                                                   itemLabel="#{cli.nombre}" itemValue="#{cli.idClinica}"/>
                                </p:selectOneMenu>

                                <p:commandButton value="#{msg['boton.asignarRol']}" icon="pi pi-plus"
                                                 actionListener="#{personaModel.agregarRol()}"
                                                 process="panelNuevoRol" update="panelNuevoRol tablaRoles :frmPersona:mensajes :avisos"
                                                 styleClass="ui-button-info" rendered="#{not personaModel.editandoRol}"/>
                                                 
                                <p:commandButton value="#{msg['boton.guardar']}" icon="pi pi-pencil"
                                                 actionListener="#{personaModel.modificarRol()}"
                                                 process="panelNuevoRol" update="panelNuevoRol tablaRoles :frmPersona:mensajes :avisos"
                                                 styleClass="ui-button-warning" rendered="#{personaModel.editandoRol}"/>
                                                 
                                <p:commandButton value="#{msg['boton.cancelar']}" icon="pi pi-times"
                                                 actionListener="#{personaModel.cancelarEdicionRol()}"
                                                 process="@this" update="panelNuevoRol tablaRoles"
                                                 styleClass="ui-button-secondary" rendered="#{personaModel.editandoRol}"/>
                            </h:panelGrid>
                        </h:panelGroup>

                        <p:dataTable id="tablaRoles" value="#{personaModel.rolesDePersona}" var="pr"
                                     emptyMessage="#{msg['tabla.sinRegistros']}"
                                     selectionMode="single" selection="#{personaModel.rolSeleccionado}"
                                     rowKey="#{pr.idPersonaRol}">
                                     
                            <p:ajax event="rowSelect" listener="#{personaModel.onRolSelect}" update="panelNuevoRol"/>
                            
                            <p:column headerText="#{msg['rol.titulo']}">
                                <h:outputText value="#{pr.idRol.nombre}"/>
                            </p:column>
                            <p:column headerText="#{msg['clinica.titulo']}">
                                <h:outputText value="#{pr.idClinica.nombre}"/>
                            </p:column>
                            <p:column headerText="#{msg['tabla.accion']}" width="100" style="text-align:center;">
                                <p:commandButton icon="pi pi-trash" styleClass="ui-button-danger rounded-button"
                                                 actionListener="#{personaModel.eliminarRol(pr)}"
                                                 process="@this" update="tablaRoles panelNuevoRol :frmPersona:mensajes :avisos">
                                    <p:confirm header="#{msg['confirm.titulo']}" message="#{msg['confirm.eliminar']}" icon="pi pi-info-circle"/>
                                </p:commandButton>
                            </p:column>
                        </p:dataTable>
                    </p:tab>

                    <!-- ─── Pestaña 2: Medios de Contacto ─── -->
                    <p:tab title="#{msg['persona.tab.mediosContacto']}">
                        <h:panelGroup id="panelNuevoMedio" style="margin-bottom:15px; display:block;">
                            <h:panelGrid columns="7" cellpadding="5" styleClass="ui-fluid">
                                <p:outputLabel value="#{msg['medioContacto.form.tipoMedioContacto']}:"/>
                                <p:selectOneMenu value="#{personaModel.idTipoMedioContactoSeleccionado}" style="width:200px" required="true" requiredMessage="#{msg['persona.seleccione.medio']}">
                                    <f:selectItem itemLabel="#{msg['examenTipoExamen.form.seleccione']}" itemValue=""/>
                                    <f:selectItems value="#{personaModel.tiposMedioContacto}" var="tmc"
                                                   itemLabel="#{tmc.nombre}" itemValue="#{tmc.idTipoMedioContacto}"/>
                                </p:selectOneMenu>

                                <p:outputLabel value="#{msg['medioContacto.form.valor']}:"/>
                                <p:inputText value="#{personaModel.nuevoMedioContacto.valor}" size="30" required="true" requiredMessage="#{msg['medioContacto.valor.requerido']}" maxlength="255"/>

                                <p:commandButton value="#{msg['boton.agregarContacto']}" icon="pi pi-plus"
                                                 actionListener="#{personaModel.agregarMedioContacto()}"
                                                 process="panelNuevoMedio" update="panelNuevoMedio tablaMedios :frmPersona:mensajes :avisos"
                                                 styleClass="ui-button-info" rendered="#{not personaModel.editandoMedio}"/>
                                                 
                                <p:commandButton value="#{msg['boton.guardar']}" icon="pi pi-pencil"
                                                 actionListener="#{personaModel.modificarMedioContacto()}"
                                                 process="panelNuevoMedio" update="panelNuevoMedio tablaMedios :frmPersona:mensajes :avisos"
                                                 styleClass="ui-button-warning" rendered="#{personaModel.editandoMedio}"/>

                                <p:commandButton value="#{msg['boton.cancelar']}" icon="pi pi-times"
                                                 actionListener="#{personaModel.cancelarEdicionMedio()}"
                                                 process="@this" update="panelNuevoMedio tablaMedios"
                                                 styleClass="ui-button-secondary" rendered="#{personaModel.editandoMedio}"/>
                            </h:panelGrid>
                        </h:panelGroup>

                        <p:dataTable id="tablaMedios" value="#{personaModel.mediosDeContacto}" var="mc"
                                     emptyMessage="#{msg['tabla.sinRegistros']}"
                                     selectionMode="single" selection="#{personaModel.medioSeleccionado}"
                                     rowKey="#{mc.idMedioContacto}">
                                     
                            <p:ajax event="rowSelect" listener="#{personaModel.onMedioSelect}" update="panelNuevoMedio"/>
                            
                            <p:column headerText="#{msg['medioContacto.tabla.tipoMedioContacto']}">
                                <h:outputText value="#{mc.idTipoMedioContacto.nombre}"/>
                            </p:column>
                            <p:column headerText="#{msg['medioContacto.tabla.valor']}">
                                <h:outputText value="#{mc.valor}"/>
                            </p:column>
                            <p:column headerText="#{msg['tabla.accion']}" width="100" style="text-align:center;">
                                <p:commandButton icon="pi pi-trash" styleClass="ui-button-danger rounded-button"
                                                 actionListener="#{personaModel.eliminarMedioContacto(mc)}"
                                                 process="@this" update="tablaMedios panelNuevoMedio :frmPersona:mensajes :avisos">
                                    <p:confirm header="#{msg['confirm.titulo']}" message="#{msg['confirm.eliminar']}" icon="pi pi-info-circle"/>
                                </p:commandButton>
                            </p:column>
                        </p:dataTable>
                    </p:tab>

                </p:tabView>
            </h:panelGroup>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="#{msg['confirm.no']}" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="#{msg['confirm.si']}" type="button" styleClass="ui-confirmdialog-yes" />
            </p:confirmDialog>
        </h:form>
    </ui:define>
</ui:composition>
