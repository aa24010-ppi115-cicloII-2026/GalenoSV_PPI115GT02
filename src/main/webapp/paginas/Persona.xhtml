<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud"
                template="../WEB-INF/plantillas/general.xhtml">
    <ui:define name="titulo">#{msg['persona.titulo']} - #{msg['sistema.titulo']}</ui:define>
    <ui:define name="encabezado">#{msg['persona.titulo']}</ui:define>
    <ui:define name="contenido">
        <h:panelGrid columns="1">
            <h:panelGroup id="pnlTabla" layout="block" rendered="#{personaModel.estado eq 'NADA'}">
                <h:form id="frmTabla">
                    <h:panelGrid columns="1">
                        <g:botonesTop modelo="#{personaModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                        <p:dataTable id="tabla" value="#{personaModel.modelo}" var="r" lazy="true"
                                     paginator="true" rows="#{personaModel.cantidadRegistros}"
                                     paginatorPosition="both" emptyMessage="#{msg['tabla.sinRegistros']}"
                                     selectionMode="single" selection="#{personaModel.registro}" rowKey="#{r.idPersona}">
                            <p:ajax event="rowSelect" listener="#{personaModel.selectionHandler}"
                                    update=":pnlTabla :pnlDetalle :mensajes"/>
                            <p:column headerText="#{msg['tabla.id']}"><h:outputText value="#{r.idPersona}"/></p:column>
                            <p:column headerText="#{msg['persona.tabla.nombres']}"><h:outputText value="#{r.nombres}"/></p:column>
                            <p:column headerText="#{msg['persona.tabla.apellidos']}"><h:outputText value="#{r.apellidos}"/></p:column>
                            <p:column headerText="#{msg['persona.tabla.fechaNacimiento']}"><h:outputText value="#{personaModel.formatearFecha(r.fechaNacimiento)}"/></p:column>
                            <p:column headerText="#{msg['persona.tabla.fechaCreacion']}"><h:outputText value="#{r.fechaCreacion}"/></p:column>
                        </p:dataTable>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>
            <h:panelGroup id="pnlDetalle" layout="block">
                <h:form id="frmDetalle" rendered="#{personaModel.estado ne 'NADA'}">
                    <h:panelGrid columns="1">
                        <g:botonesTop modelo="#{personaModel}" actualizar=":pnlTabla :pnlDetalle :mensajes"/>
                        <h:panelGrid columns="2" cellpadding="5">
                            <p:outputLabel for="txtId" value="#{msg['persona.form.id']}"/>
                            <p:inputText id="txtId" value="#{personaModel.registro.idPersona}" size="50" disabled="true"/>
                            <p:outputLabel for="txtNombres" value="#{msg['persona.form.nombres']}"/>
                            <p:inputText id="txtNombres" value="#{personaModel.registro.nombres}" required="true"
                                         requiredMessage="#{msg['persona.nombres.requeridos']}" size="50" maxlength="255"/>
                            <p:outputLabel for="txtApellidos" value="#{msg['persona.form.apellidos']}"/>
                            <p:inputText id="txtApellidos" value="#{personaModel.registro.apellidos}" required="true"
                                         requiredMessage="#{msg['persona.apellidos.requeridos']}" size="50" maxlength="255"/>
                            <p:outputLabel for="fechaNacimiento" value="#{msg['persona.form.fechaNacimiento']}"/>
                            <p:datePicker id="fechaNacimiento" value="#{personaModel.fechaNacimientoSeleccionada}"
                                          pattern="dd/MM/yyyy" showIcon="true" monthNavigator="true" yearNavigator="true"/>
                            <p:outputLabel for="txtFechaCreacion" value="#{msg['persona.form.fechaCreacion']}"/>
                            <p:inputText id="txtFechaCreacion" value="#{personaModel.registro.fechaCreacion}" size="50" disabled="true"/>
                        </h:panelGrid>
                        <h:panelGrid columns="#{personaModel.estado eq 'CREAR' ? 1 : 2}">
                            <p:commandButton id="btnGuardar" value="#{msg['boton.guardar']}" actionListener="#{personaModel.btnGuardarHandler}" rendered="#{personaModel.estado eq 'CREAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                            <p:commandButton id="btnModificar" value="#{msg['boton.modificar']}" actionListener="#{personaModel.btnModificarHandler}" rendered="#{personaModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                            <p:commandButton id="btnEliminar" value="#{msg['boton.eliminar']}" actionListener="#{personaModel.btnEliminarHandler}" rendered="#{personaModel.estado eq 'MODIFICAR'}" update=":pnlTabla :pnlDetalle :mensajes"/>
                        </h:panelGrid>
                    </h:panelGrid>
                </h:form>
            </h:panelGroup>
        </h:panelGrid>
    </ui:define>
</ui:composition>
