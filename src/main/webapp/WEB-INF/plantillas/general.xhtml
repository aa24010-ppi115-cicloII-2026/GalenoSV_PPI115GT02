<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets">
<f:view locale="#{idiomaBean.locale}">
    <h:head>
        <title>
            <ui:insert name="titulo">#{msg['sistema.titulo']}</ui:insert>
        </title>
    </h:head>
    <h:body>
        <div class="ui-g">
            <div class="ui-g-12 ui-md-3">
                <h:outputText value="#{msg['sistema.titulo']}"/>
            </div>
            <div class="ui-g-12 ui-md-6">
                <h1>
                    <ui:insert name="encabezado">#{msg['sistema.titulo']}</ui:insert>
                </h1>
            </div>
            <div class="ui-g-12 ui-md-3">
                <h:form id="frmIdioma">
                    <p:selectOneMenu id="cmbIdioma" value="#{idiomaBean.idioma}">
                        <f:selectItem itemLabel="#{msg['idioma.espanol']}" itemValue="es"/>
                        <f:selectItem itemLabel="#{msg['idioma.ingles']}"  itemValue="en"/>
                        <f:selectItem itemLabel="#{msg['idioma.frances']}" itemValue="fr"/>
                        <f:selectItem itemLabel="#{msg['idioma.chino']}"   itemValue="zh"/>
                        <p:ajax listener="#{idiomaBean.cambiarIdioma()}" update="@all"/>
                    </p:selectOneMenu>
                </h:form>
            </div>

            <div class="ui-g-12 ui-md-2">
                <nav>
                    <h:form id="frmMenu">
                        <p:panelMenu id="menuPrincipal" style="width:100%">

                            <!-- ── 1. Catálogos base ── -->
                            <p:submenu label="Catalogos">
                                <p:menuitem value="Tipos de Contacto"    outcome="/paginas/TipoMedioContacto"/>
                                <p:menuitem value="Tipos de Documento"   outcome="/paginas/TipoDocumento"/>
                                <p:menuitem value="Tipos de Examen"      outcome="/paginas/TipoExamen"/>
                                <p:menuitem value="Examenes"             outcome="/paginas/Examen"/>
                                <p:menuitem value="Clinicas"             outcome="/paginas/Clinica"/>
                                <p:menuitem value="Roles"                outcome="/paginas/Rol"/>
                            </p:submenu>

                            <!-- ── 2. Personas ── -->
                            <p:submenu label="Personas">
                                <p:menuitem value="Personas"             outcome="/paginas/Persona"/>
                                <p:menuitem value="Asignacion de Roles"  outcome="/paginas/PersonaRol"/>
                            </p:submenu>

                            <!-- ── 3. Procedimientos ── -->
                            <p:menuitem value="Procedimientos"       outcome="/paginas/Procedimiento" icon="pi pi-fw pi-sitemap"/>

                            <!-- ── 4. Atención Clínica ── -->
                            <p:submenu label="Atencion">
                                <p:menuitem value="Consultas"            outcome="/paginas/Consulta"/>
                                <p:menuitem value="Resultados de Examen" outcome="/paginas/ExamenResultado"/>
                            </p:submenu>

                        </p:panelMenu>
                    </h:form>
                </nav>
            </div>
            <main class="ui-g-12 ui-md-10">
                <p:messages id="mensajes" showDetail="true" closable="true"/>
                <ui:insert name="contenido">
                    <h:outputText value="#{msg['layout.sinContenido']}"/>
                </ui:insert>
            </main>

            <footer class="ui-g-12">
                <h:outputText value="#{msg['layout.footer']}"/>
            </footer>
        </div>

        <ui:insert name="extras"/>
    </h:body>
</f:view>
</html>
